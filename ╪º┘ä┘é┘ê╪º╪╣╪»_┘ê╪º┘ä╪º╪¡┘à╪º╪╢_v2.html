<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0F172A" />
<title>قوة الأحماض والقواعد — VR · الأمد</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" />
<style>
/* =====================================================================
 * AmadXR design tokens
 *   Space navy  #0F172A  — environment + UI base
 *   Purple      #7C3AED  — accent / primary action
 *   Gold        #F59E0B  — achievement, highlights
 *   Cyan        #22D3EE  — information + interactivity
 * ===================================================================== */
:root {
  --space: #0F172A;
  --space-2: #151F38;
  --space-3: #1C2847;
  --line: rgba(148, 163, 184, 0.18);
  --line-2: rgba(148, 163, 184, 0.32);
  --ink: #F1F5F9;
  --ink-2: #B4C0D3;
  --ink-3: #7B8AA5;
  --purple: #7C3AED;
  --purple-2: #9D6BF2;
  --gold: #F59E0B;
  --gold-2: #FBBF24;
  --cyan: #22D3EE;
  --ok: #34D399;
  --bad: #F87171;
  --font: "IBM Plex Sans Arabic", "IBM Plex Sans", system-ui, "Segoe UI", Tahoma, sans-serif;
  --r-lg: 20px;
  --r-md: 14px;
  --r-sm: 10px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; background: var(--space); color: var(--ink); font-family: var(--font); }
body { -webkit-font-smoothing: antialiased; }
canvas { display: block; }
button, input { font-family: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--cyan); outline-offset: 3px; }
[hidden] { display: none !important; }
.ltr { direction: ltr; unicode-bidi: isolate; }

/* ------------------------------------------------------------ lobby */
#lobby {
  position: fixed; inset: 0; z-index: 30; overflow-y: auto;
  display: flex; flex-direction: column;
  background: radial-gradient(120% 90% at 50% 0%, #17224A 0%, var(--space) 58%);
}
#lobby-ions { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; opacity: 0.55; }
.lobby-shell {
  position: relative; flex: 1;
  display: grid; grid-template-columns: minmax(0, 1.08fr) minmax(0, 0.92fr); gap: 28px;
  width: min(1120px, 94vw); margin: 0 auto; padding: 48px 0 24px; align-items: start;
}
.panel {
  background: rgba(17, 25, 45, 0.86);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  backdrop-filter: blur(10px);
}
.lobby-main { padding: 40px 40px 34px; }
.brand-logo { height: 58px; width: auto; display: block; margin-bottom: 28px; }
.welcome { font-size: 14px; color: var(--ink-3); margin-bottom: 10px; }
.lobby-title { font-size: clamp(30px, 4.4vw, 46px); font-weight: 700; line-height: 1.2; letter-spacing: -0.01em; margin-bottom: 14px; }
.lede { font-size: 17px; line-height: 1.75; color: var(--ink-2); max-width: 46ch; margin-bottom: 22px; }
.meta { list-style: none; display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 30px; }
.meta-foot { margin: 22px 0 0; }
.mode-btn { padding: 20px 20px !important; }
.mode-btn strong { font-size: 18px !important; }
.meta li {
  display: inline-flex; align-items: center; gap: 7px;
  font-size: 13.5px; color: var(--ink-2);
  padding: 7px 12px; border-radius: 999px; background: rgba(255,255,255,0.04); border: 1px solid var(--line);
}
.meta svg { width: 15px; height: 15px; color: var(--cyan); flex: none; }
.field-label { display: block; font-size: 13.5px; color: var(--ink-2); margin-bottom: 8px; }
.row-between { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 22px; flex-wrap: wrap; }
.seg { display: inline-flex; padding: 4px; border-radius: 999px; background: rgba(255,255,255,0.04); border: 1px solid var(--line); }
.seg button {
  border: 0; background: transparent; color: var(--ink-2); font-size: 14px; font-weight: 600;
  padding: 8px 18px; border-radius: 999px; transition: background 160ms ease, color 160ms ease;
}
.seg button[aria-pressed="true"] { background: var(--purple); color: #fff; }
.modes { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.mode-btn {
  display: flex; flex-direction: column; align-items: flex-start; gap: 4px; text-align: start;
  padding: 16px 18px; border-radius: var(--r-md); border: 1px solid var(--line-2);
  background: rgba(255,255,255,0.04); color: var(--ink); transition: transform 140ms ease, background 160ms ease, border-color 160ms ease;
}
.mode-btn strong { font-size: 17px; font-weight: 700; display: flex; align-items: center; gap: 9px; }
.mode-btn span { font-size: 13px; color: var(--ink-3); }
.mode-btn svg { width: 20px; height: 20px; }
.mode-btn.primary { background: var(--purple); border-color: var(--purple); }
.mode-btn.primary span { color: rgba(255,255,255,0.78); }
.mode-btn:hover:not(:disabled) { transform: translateY(-1px); }
.mode-btn.primary:hover:not(:disabled) { background: #8B4DF0; }
.mode-btn:not(.primary):hover:not(:disabled) { border-color: var(--cyan); background: rgba(34,211,238,0.07); }
.mode-btn:disabled { opacity: 0.42; cursor: not-allowed; }
.vr-status { font-size: 13px; color: var(--ink-3); margin-top: 12px; min-height: 1em; }

.lobby-side { padding: 30px 30px 22px; }
.side-title { font-size: 15px; font-weight: 600; color: var(--ink-2); margin-bottom: 16px; }
.journey { list-style: none; position: relative; margin-bottom: 18px; }
.journey li { position: relative; display: grid; grid-template-columns: 34px 1fr; gap: 14px; padding-bottom: 18px; }
.journey li:not(:last-child)::after {
  content: ""; position: absolute; inset-inline-start: 16px; top: 34px; bottom: 2px; width: 2px; background: var(--line-2);
}
.journey .num {
  width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center;
  font-weight: 700; font-size: 14px; color: var(--cyan); border: 1.5px solid rgba(34,211,238,0.55); background: rgba(34,211,238,0.06);
}
.journey li:last-child .num { color: var(--gold); border-color: rgba(245,158,11,0.6); background: rgba(245,158,11,0.07); }
.journey h3 { font-size: 15.5px; font-weight: 600; line-height: 1.45; margin-top: 5px; }
.journey p { font-size: 13.5px; color: var(--ink-3); line-height: 1.6; margin-top: 2px; }
.journey-intro { font-size: 13.5px; color: var(--ink-3); line-height: 1.7; margin-bottom: 18px; }
details { border-top: 1px solid var(--line); }
details summary {
  list-style: none; cursor: pointer; padding: 14px 2px; font-size: 14.5px; font-weight: 600; color: var(--ink);
  display: flex; align-items: center; justify-content: space-between;
}
details summary::-webkit-details-marker { display: none; }
details summary::after { content: "+"; color: var(--ink-3); font-size: 18px; font-weight: 400; transition: transform 160ms ease; }
details[open] summary::after { transform: rotate(45deg); }
details .body { padding: 0 2px 16px; font-size: 14px; color: var(--ink-2); line-height: 1.75; }
.lo-list { list-style: none; display: grid; gap: 10px; }
.lo-list li { display: grid; grid-template-columns: 44px 1fr; gap: 10px; align-items: start; }
.lo-code { font-size: 12px; font-weight: 700; color: var(--purple-2); background: rgba(124,58,237,0.14); border-radius: 6px; padding: 3px 0; text-align: center; direction: ltr; }
.lobby-foot { position: relative; text-align: center; font-size: 12.5px; color: var(--ink-3); padding: 12px 0 22px; }

@media (max-width: 880px) {
  .lobby-shell { grid-template-columns: 1fr; padding-top: 24px; }
  .lobby-main { padding: 28px 22px; }
  .lobby-side { padding: 22px; }
  .modes { grid-template-columns: 1fr; }
}

/* ------------------------------------------------------------ loading */
#loading {
  position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; background: var(--space);
  transition: opacity 400ms ease;
}
#loading.out { opacity: 0; pointer-events: none; }
.loader { display: grid; justify-items: center; gap: 18px; color: var(--ink-2); font-size: 15px; }
.loader-bar { width: 180px; height: 3px; border-radius: 3px; background: var(--line); overflow: hidden; }
.loader-bar i { display: block; width: 40%; height: 100%; background: var(--cyan); animation: load 1.1s ease-in-out infinite; }
@keyframes load { 0% { transform: translateX(-120%); } 100% { transform: translateX(280%); } }

/* ------------------------------------------------------------ desktop HUD */
#hud { position: fixed; inset: 0; z-index: 20; pointer-events: none; }
#hud > * { pointer-events: auto; }
.hud-top {
  position: absolute; top: 14px; inset-inline: 14px;
  display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 16px;
  padding: 8px 10px; border-radius: 16px;
  background: rgba(15, 23, 42, 0.82); border: 1px solid var(--line); backdrop-filter: blur(10px);
}
.hud-brand { display: flex; align-items: center; gap: 12px; padding-inline-start: 6px; min-width: 0; }
.hud-brand img { height: 26px; width: auto; }
.hud-brand span { font-size: 14px; font-weight: 600; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stepper { display: flex; justify-content: center; align-items: center; gap: 6px; min-width: 0; }
.step { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-3); white-space: nowrap; }
.step .dot {
  width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; flex: none;
  font-size: 12px; font-weight: 700; border: 1.5px solid var(--line-2); color: var(--ink-3);
}
.step .dot svg { width: 12px; height: 12px; }
.step.active { color: var(--ink); }
.step.active .dot { border-color: var(--cyan); color: var(--cyan); background: rgba(34,211,238,0.1); }
.step.done .dot { border-color: var(--ok); background: var(--ok); color: #06281c; }
.step-sep { width: 22px; height: 2px; border-radius: 2px; background: var(--line-2); flex: none; }
.step-sep.done { background: var(--ok); }
.hud-actions { display: flex; gap: 6px; }
.icon-btn {
  width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center;
  border: 1px solid transparent; background: rgba(255,255,255,0.05); color: var(--ink-2);
  transition: background 140ms ease, color 140ms ease, border-color 140ms ease; font-size: 13px; font-weight: 700;
}
.icon-btn svg { width: 19px; height: 19px; }
.icon-btn:hover { background: rgba(34,211,238,0.12); color: var(--ink); }
.icon-btn[aria-pressed="false"] { color: var(--ink-3); }
.icon-btn.vr { width: auto; padding: 0 14px; background: var(--purple); color: #fff; }
.objective {
  position: absolute; top: 76px; left: 50%; transform: translateX(-50%);
  display: flex; align-items: center; gap: 12px; max-width: min(760px, 92vw);
  padding: 9px 16px; border-radius: 999px; background: rgba(15,23,42,0.78); border: 1px solid var(--line);
  font-size: 14px; color: var(--ink); backdrop-filter: blur(8px);
}
.objective .obj-label { color: var(--cyan); font-weight: 600; white-space: nowrap; }
.objective .obj-count { color: var(--ink-3); white-space: nowrap; font-size: 13px; }
.bottom-stack {
  position: absolute; bottom: 22px; left: 50%; transform: translateX(-50%);
  width: min(820px, 92vw); display: grid; gap: 10px; justify-items: center; pointer-events: none;
}
.bubble {
  pointer-events: auto; display: flex; align-items: flex-start; gap: 12px;
  padding: 12px 16px; border-radius: 14px; font-size: 15px; line-height: 1.6;
  background: rgba(15,23,42,0.9); border: 1px solid var(--line-2); backdrop-filter: blur(8px);
  animation: rise 220ms ease-out;
}
.bubble svg { width: 20px; height: 20px; flex: none; margin-top: 2px; }
.bubble.hint { border-color: rgba(245,158,11,0.55); }
.bubble.hint svg { color: var(--gold); }
.bubble.ok { border-color: rgba(52,211,153,0.6); }
.bubble.ok svg { color: var(--ok); }
.bubble.bad { border-color: rgba(248,113,113,0.6); }
.bubble.bad svg { color: var(--bad); }
.bubble.info svg { color: var(--cyan); }
#captions {
  pointer-events: none; max-width: 100%; text-align: center;
  padding: 10px 18px; border-radius: 12px; background: rgba(8, 12, 24, 0.84);
  font-size: 17px; line-height: 1.65; color: #fff;
}
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.pop {
  position: absolute; top: 76px; inset-inline-end: 14px; width: min(380px, 92vw);
  padding: 18px; border-radius: 16px; background: rgba(15,23,42,0.95); border: 1px solid var(--line-2);
  backdrop-filter: blur(12px); animation: rise 180ms ease-out; max-height: calc(100vh - 110px); overflow-y: auto;
}
.pop h4 { font-size: 15px; font-weight: 700; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
.pop .close { border: 0; background: none; color: var(--ink-3); font-size: 20px; line-height: 1; }
.pop .sect { font-size: 12.5px; color: var(--ink-3); margin: 14px 0 6px; }
.pop p { font-size: 14px; line-height: 1.7; color: var(--ink-2); }
.toggle {
  display: flex; justify-content: space-between; align-items: center; gap: 12px; width: 100%;
  padding: 11px 0; border: 0; border-bottom: 1px solid var(--line); background: none; color: var(--ink); font-size: 14.5px; text-align: start;
}
.toggle .sw { width: 38px; height: 22px; border-radius: 999px; background: var(--line-2); position: relative; flex: none; transition: background 160ms ease; }
.toggle .sw::after { content: ""; position: absolute; top: 3px; inset-inline-start: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: inset-inline-start 160ms ease; }
.toggle[aria-checked="true"] .sw { background: var(--purple); }
.toggle[aria-checked="true"] .sw::after { inset-inline-start: 19px; }
.range-row { display: grid; grid-template-columns: 1fr 140px 44px; align-items: center; gap: 10px; padding: 11px 0; border-bottom: 1px solid var(--line); font-size: 14.5px; }
.range-row input { width: 100%; accent-color: var(--purple); }
.range-row b { font-weight: 600; color: var(--ink-2); font-size: 13px; text-align: end; direction: ltr; }
.icon-btn.speaking { color: var(--cyan); box-shadow: inset 0 0 0 1px rgba(34,211,238,0.5); }
.pop .wide-btn {
  width: 100%; margin-top: 14px; padding: 11px; border-radius: 12px; border: 1px solid var(--line-2);
  background: rgba(255,255,255,0.04); color: var(--ink); font-size: 14px; font-weight: 600;
}
.pop .wide-btn:hover { border-color: var(--cyan); }
.keys { display: grid; grid-template-columns: auto 1fr; gap: 7px 12px; font-size: 13.5px; color: var(--ink-2); }
kbd {
  font-family: "IBM Plex Sans", system-ui, sans-serif; font-size: 12px; font-weight: 600; color: var(--ink);
  padding: 2px 7px; border-radius: 6px; border: 1px solid var(--line-2); background: rgba(255,255,255,0.05); white-space: nowrap; direction: ltr;
}
@media (max-width: 900px) {
  .step .lbl { display: none; }
  .hud-brand span { display: none; }
  .objective { top: 72px; font-size: 13px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}
</style>
</head>
<body>

<!-- ================================================ LOBBY / WELCOME -->
<div id="lobby">
  <canvas id="lobby-ions" aria-hidden="true"></canvas>
  <main class="lobby-shell">
    <section class="lobby-main panel" aria-labelledby="lb-title">
      <img class="brand-logo" id="lb-logo" alt="الأمد" />
      <p class="welcome" id="lb-welcome"></p>
      <h1 class="lobby-title" id="lb-title"></h1>
      <p class="lede" id="lb-lede"></p>
      <div class="row-between">
        <div class="seg" role="group" aria-label="Language / اللغة">
          <button type="button" id="lang-ar" aria-pressed="true">عربي</button>
          <button type="button" id="lang-en" aria-pressed="false">English</button>
        </div>
      </div>

      <div class="modes">
        <button type="button" class="mode-btn primary" id="btn-vr">
          <strong><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3 8.5A2.5 2.5 0 0 1 5.5 6h13A2.5 2.5 0 0 1 21 8.5v6a2.5 2.5 0 0 1-2.5 2.5h-3.2l-1.8-2.4a1.9 1.9 0 0 0-3 0L8.7 17H5.5A2.5 2.5 0 0 1 3 14.5z"/><circle cx="8" cy="11.5" r="1.6"/><circle cx="16" cy="11.5" r="1.6"/></svg><span class="t" id="lb-vr-t"></span></strong>
          <span id="lb-vr-s"></span>
        </button>
        <button type="button" class="mode-btn" id="btn-desktop">
          <strong><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="12" rx="2"/><path d="M9 20h6M12 16.5V20"/></svg><span class="t" id="lb-dk-t"></span></strong>
          <span id="lb-dk-s"></span>
        </button>
      </div>
      <p class="vr-status" id="vr-status" role="status"></p>
      <ul class="meta meta-foot" id="lb-meta"></ul>
    </section>

    <aside class="lobby-side panel" aria-labelledby="lb-journey-title">
      <h2 class="side-title" id="lb-journey-title"></h2>
      <p class="journey-intro" id="lb-journey-intro"></p>
      <ol class="journey" id="lb-journey"></ol>
      <details id="lb-lo">
        <summary id="lb-lo-sum"></summary>
        <div class="body"><ul class="lo-list" id="lb-lo-list"></ul></div>
      </details>
      <details>
        <summary id="lb-mg-sum"></summary>
        <div class="body"><p id="lb-mg-body"></p></div>
      </details>
      <details>
        <summary id="lb-ct-sum"></summary>
        <div class="body"><p id="lb-ct-body"></p></div>
      </details>
    </aside>
  </main>
  <footer class="lobby-foot" id="lb-foot"></footer>
</div>

<!-- ================================================ LOADING -->
<div id="loading" hidden>
  <div class="loader"><div class="loader-bar"><i></i></div><p id="loading-text"></p></div>
</div>

<!-- ================================================ DESKTOP HUD (hidden inside the headset) -->
<div id="hud" hidden>
  <div class="hud-top">
    <div class="hud-brand"><img id="hud-logo" alt="" /><span id="hud-title"></span></div>
    <nav class="stepper" id="hud-stepper" aria-label="Progress"></nav>
    <div class="hud-actions">
      <button class="icon-btn" id="hud-help" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.3a2.5 2.5 0 1 1 3.6 2.3c-.8.4-1.2 1-1.2 1.9M12 16.8v.1"/></svg></button>
      <button class="icon-btn" id="hud-replay" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3"/><path d="M4.5 4.5v3.6h3.6"/><path d="M10.5 9.3v5.4l4.2-2.7z" fill="currentColor"/></svg></button>
      <button class="icon-btn" id="hud-audio" type="button" aria-pressed="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path class="wave" d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/><path class="mute" d="M16 9.5l5 5M21 9.5l-5 5" style="display:none"/></svg></button>
      <button class="icon-btn" id="hud-cc" type="button" aria-pressed="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><rect x="3" y="5.5" width="18" height="13" rx="2.5"/><path d="M10.5 10.2a2.2 2.2 0 1 0 0 3.6M17 10.2a2.2 2.2 0 1 0 0 3.6"/></svg></button>
      <button class="icon-btn" id="hud-lang" type="button">EN</button>
      <button class="icon-btn" id="hud-settings" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></button>
      <button class="icon-btn vr" id="hud-vr" type="button" hidden></button>
    </div>
  </div>
  <div class="objective" id="hud-objective" hidden>
    <span class="obj-label" id="hud-obj-label"></span>
    <span id="hud-obj-text"></span>
    <span class="obj-count" id="hud-obj-count"></span>
  </div>

  <div class="bottom-stack">
    <div class="bubble" id="hud-bubble" hidden role="status" aria-live="polite"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.6 10.8c.6.5 1 1.2 1 2V16h5.2v-.2c0-.8.4-1.5 1-2A6 6 0 0 0 12 3z"/></svg><span id="hud-bubble-text"></span></div>
    <div id="captions" hidden aria-live="polite"><p id="captions-text"></p></div>
  </div>

  <div class="pop" id="pop-help" hidden role="dialog" aria-labelledby="pop-help-t">
    <h4><span id="pop-help-t"></span><button class="close" data-close="pop-help" aria-label="close">×</button></h4>
    <p class="sect" id="pop-help-hint-t"></p>
    <p id="pop-help-hint"></p>

const CONFIG = {"experience": {"id": "alamad-chem-acids-bases-v1", "title": {"ar": "قوة الأحماض والقواعد", "en": "The Strength of Acids and Bases"}, "course": {"ar": "الكيمياء 3 — الفصل الثاني — الدرس 2-2", "en": "Chemistry 3 — Chapter 2 — Lesson 2-2"}, "audience": {"ar": "الصف الثالث الثانوي — مسار العلوم الطبيعية", "en": "Grade 12 — Natural Sciences Track"}, "totalScenes": 4, "estimatedDurationMin": 16, "defaultLanguage": "ar", "version": "1.0.0-pre-webxr"}, "learningObjectives": [{"code": "LO1", "ar": "يميّز الطالب بين الحمض القوي والحمض الضعيف بناءً على درجة تأينهما في الماء.", "en": "Distinguish between strong and weak acids based on their degree of ionization in water."}, {"code": "LO2", "ar": "يميّز الطالب بين القاعدة القوية والقاعدة الضعيفة بناءً على درجة تأينها.", "en": "Distinguish between strong and weak bases based on their degree of ionization."}, {"code": "LO3", "ar": "يفسّر الطالب ثابت تأين الحمض (Ka) وثابت تأين القاعدة (Kb) كمؤشر على القوة النسبية.", "en": "Interpret the acid ionization constant (Ka) and base ionization constant (Kb) as indicators of relative strength."}, {"code": "LO4", "ar": "يصنّف الطالب الأحماض والقواعد الشائعة إلى قوية وضعيفة وفق قيم Ka وKb.", "en": "Classify common acids and bases as strong or weak based on Ka and Kb values."}, {"code": "LO5", "ar": "يحلّل الطالب الفرق المفاهيمي بين قوة الحمض/القاعدة وتركيزه.", "en": "Analyze the conceptual difference between acid/base strength and concentration."}], "ui": {"appTitle": {"ar": "الأمد", "en": "Al-Amad"}, "tagline": {"ar": "حيث تُلمس الأفكار", "en": "Where Ideas Become Tangible"}, "languageToggleAr": "AR", "languageToggleEn": "EN", "sceneCounter": {"ar": "المشهد", "en": "Scene"}, "of": {"ar": "من", "en": "of"}, "begin": {"ar": "ابدأ التجربة", "en": "Begin Experience"}, "continue": {"ar": "متابعة", "en": "Continue"}, "next": {"ar": "التالي", "en": "Next"}, "proceedNextScene": {"ar": "الانتقال إلى المشهد التالي", "en": "Proceed to Next Scene"}, "requirementNotMet": {"ar": "أكمل متطلّبات هذا المشهد للمتابعة", "en": "Complete this scene's requirements to proceed"}, "audioOn": {"ar": "تشغيل الصوت", "en": "Audio On"}, "audioOff": {"ar": "إيقاف الصوت", "en": "Audio Off"}, "captions": {"ar": "الترجمة", "en": "Captions"}, "loading": {"ar": "يُحضَّر المشهد...", "en": "Preparing scene..."}, "close": {"ar": "إغلاق", "en": "Close"}, "safetyTitle": {"ar": "إجراءات السلامة في المختبر", "en": "Laboratory Safety"}, "safetyNarration": {"ar": "مرحبًا بك في مختبر الكيمياء. قبل البدء، تأكد من ارتداء المعطف ونظارات السلامة.", "en": "Welcome to the chemistry lab. Before you begin, make sure to wear the lab coat and safety goggles."}, "safetyCoat": {"ar": "ارتداء المعطف", "en": "Wear the lab coat"}, "safetyGoggles": {"ar": "ارتداء نظارات السلامة", "en": "Wear safety goggles"}, "safetyEnter": {"ar": "دخول المختبر", "en": "Enter the Laboratory"}}, "introScreen": {"welcome": {"ar": "مرحباً بك في تجربة الأمد الغامرة", "en": "Welcome to the Al-Amad Immersive Experience"}, "subtitle": {"ar": "منظومة محاكاة احترافية متكاملة لصناعة الإتقان", "en": "An Integrated Professional Simulation System for Mastery-Building"}, "experienceTitle": {"ar": "قوة الأحماض والقواعد", "en": "The Strength of Acids and Bases"}, "duration": {"ar": "المدة التقديرية: 16 دقيقة", "en": "Estimated duration: 16 minutes"}, "scenes": {"ar": "4 مشاهد متتالية", "en": "4 sequential scenes"}, "objectivesTitle": {"ar": "أهداف التعلّم", "en": "Learning Objectives"}, "masteryNotice": {"ar": "هذه التجربة تطبّق مبدأ بوّابة الإتقان: لا تنتقل من مشهد إلى الذي يليه قبل إتمام متطلباته.", "en": "This experience applies the Mastery Gating principle: no scene transitions before its requirements are met."}, "learnerNameLabel": {"ar": "اسم المتعلّم (يظهر في الشهادة)", "en": "Learner name (appears on certificate)"}, "learnerNamePlaceholder": {"ar": "اكتب اسمك", "en": "Enter your name"}}, "scene1": {"code": "S1", "title": {"ar": "اكتشاف القوة عبر الموصلية", "en": "Discovering Strength Through Conductivity"}, "completionRule": "discover-min", "completionThreshold": {"visitedStations": 3, "hypothesisSelected": true}, "narration": {"intro": {"ar": "مرحباً بك. ستجد أمامك ثلاث محطات تجريبية. تأمّلها جيّداً قبل أن تتحرّك.", "en": "Welcome. You will see three experimental stations. Examine them carefully before moving."}, "guidance": {"ar": "ثلاث محطات، ثلاث محاليل، وثلاثة مصابيح. اقترب من المحطة الأولى واضغط المفتاح لإغلاق الدائرة الكهربائية.", "en": "Three stations, three solutions, three lamps. Approach the first station and press the switch to close the electrical circuit."}, "station1": {"ar": "المحطة الأولى: حمض الهيدروكلوريك. لاحظ كيف يضيء المصباح بسطوع كامل.", "en": "Station 1: Hydrochloric acid. Notice how the lamp glows at full brightness."}, "station2": {"ar": "المحطة الثانية: حمض الخليك، وهو الحمض الموجود في الخل. المصباح يضيء بخفوت.", "en": "Station 2: Acetic acid — the acid found in vinegar. The lamp glows dimly."}, "station3": {"ar": "المحطة الثالثة: ماء مقطّر. المصباح لا يضيء إطلاقاً.", "en": "Station 3: Distilled water. The lamp does not glow at all."}, "hypothesis": {"ar": "المحاليل الثلاثة بنفس التركيز، والمصابيح متطابقة، والأقطاب متطابقة... فلماذا اختلفت الإضاءة؟ اختر التفسير الذي تراه الأقرب للحقيقة.", "en": "All three solutions have the same concentration, identical lamps, identical electrodes... so why did the brightness differ? Choose the explanation closest to the truth."}, "closure": {"ar": "احتفظ بفرضيتك في ذهنك. سنتحقّق منها معاً من خلال نظرة مجهرية إلى ما يحدث داخل كل محلول.", "en": "Hold your hypothesis in mind. We will verify it together through a microscopic view of what happens inside each solution."}}, "stations": [{"id": "S1A", "label": {"ar": "المحطة 1", "en": "Station 1"}, "solution": "HCl", "brightness": "full", "result": {"ar": "إضاءة كاملة", "en": "Full brightness"}, "chemicalName": {"ar": "حمض الهيدروكلوريك", "en": "Hydrochloric acid"}, "formula": "HCl"}, {"id": "S1B", "label": {"ar": "المحطة 2", "en": "Station 2"}, "solution": "Acetic acid", "brightness": "dim", "result": {"ar": "إضاءة خافتة", "en": "Dim glow"}, "chemicalName": {"ar": "حمض الخليك", "en": "Acetic acid"}, "formula": "CH₃COOH"}, {"id": "S1C", "label": {"ar": "المحطة 3", "en": "Station 3"}, "solution": "Distilled water", "brightness": "off", "result": {"ar": "لا إضاءة", "en": "No glow"}, "chemicalName": {"ar": "الماء المقطّر", "en": "Distilled water"}, "formula": "H₂O"}], "switchPrompt": {"ar": "اضغط لإغلاق الدائرة", "en": "Press to close the circuit"}, "hypothesisQuestion": {"ar": "لماذا اختلفت الإضاءة؟", "en": "Why did the brightness differ?"}, "hypotheses": [{"id": "H1", "ar": "محلول HCl أكثر تركيزاً من محلول حمض الخليك", "en": "The HCl solution is more concentrated than the acetic acid solution", "kind": "misconception", "rationale": {"ar": "المحلولان مُحضَّران بالتركيز نفسه (0.1 مولار). التركيز مستبعد كعامل مفسِّر هنا.", "en": "Both solutions were prepared at the same concentration (0.1 M). Concentration is ruled out as the explanatory factor."}}, {"id": "H2", "ar": "جزيئات HCl تتفكّك إلى أيونات في الماء بنسبة أعلى بكثير", "en": "HCl molecules dissociate into ions in water at a much higher rate", "kind": "correct", "rationale": {"ar": "الأيونات الحرّة هي ما يحمل التيار الكهربائي عبر المحلول. كثرة الأيونات تعني توصيلاً أعلى وإضاءة أقوى.", "en": "Free ions are what carry electric current through the solution. More ions means higher conductivity and a brighter lamp."}}, {"id": "H3", "ar": "حرارة محلول HCl أعلى فيوصّل الكهرباء بشكل أفضل", "en": "The HCl solution is warmer, so it conducts electricity better", "kind": "inaccurate", "rationale": {"ar": "المحلولان في درجة حرارة الغرفة نفسها. الحرارة تؤثّر قليلاً في التوصيل لكنها ليست الفرق الجوهري هنا.", "en": "Both solutions are at the same room temperature. Temperature slightly affects conductivity but is not the essential difference here."}}, {"id": "H4", "ar": "أقطاب محطة HCl أكبر مساحةً من أقطاب المحطة الثانية", "en": "The HCl station's electrodes have a larger surface area", "kind": "inaccurate", "rationale": {"ar": "الأقطاب متطابقة في المحطات الثلاث — هذا ضبط تجريبي مقصود حتى يكون المتغيّر الوحيد هو نوع المحلول.", "en": "Electrodes are identical across all three stations — a deliberate experimental control so the only variable is the solution itself."}}], "summary": {"ar": "فرضيتك مسجَّلة. سنتحقّق منها معاً في المشهد التالي.", "en": "Your hypothesis is recorded. We will verify it together in the next scene."}}, "scene2": {"code": "S2", "title": {"ar": "التأيّن والتركيز — كسر الالتباس", "en": "Ionization and Concentration — Breaking the Confusion"}, "completionRule": "decisions-correct", "completionThreshold": {"decisionsCorrect": 3}, "narration": {"intro": {"ar": "تذكّر فرضيتك. سنرى الآن ما يحدث فعلاً داخل المحلول.", "en": "Remember your hypothesis. Now we will see what really happens inside the solution."}, "guidance": {"ar": "هنا حمض الهيدروكلوريك. كل جزيء منه يتأيّن كاملاً في الماء. أمّا هنا حمض الخليك، فجزء يسير فقط من جزيئاته يتأيّن، بينما تبقى الأغلبية متّحدة.", "en": "Here is hydrochloric acid — every molecule ionizes completely in water. Here is acetic acid — only a small fraction ionizes, while the majority remains intact."}, "closure": {"ar": "الآن صار الفرق واضحاً: القوة صفة للحمض ذاته، والتركيز كميّة المحلول.", "en": "Now the difference is clear: strength is a property of the acid itself; concentration is a quantity of the solution."}}, "leftTank": {"name": "HCl", "label": {"ar": "HCl — تأيّن 100%", "en": "HCl — 100% ionization"}, "kaLabel": {"ar": "Ka كبيرة جداً", "en": "Ka very large"}, "ionizationRatio": 1.0, "chemicalName": {"ar": "حمض الهيدروكلوريك (HCl)", "en": "Hydrochloric acid (HCl)"}}, "rightTank": {"name": "CH₃COOH", "label": {"ar": "CH₃COOH — تأيّن ≈ 5%", "en": "CH₃COOH — ≈ 5% ionization"}, "kaLabel": {"ar": "Ka = 1.8 × 10⁻⁵", "en": "Ka = 1.8 × 10⁻⁵"}, "ionizationRatio": 0.05, "chemicalName": {"ar": "حمض الخليك (CH₃COOH)", "en": "Acetic acid (CH₃COOH)"}}, "decisions": [{"id": "D1", "question": {"ar": "في التجربة السابقة أضاء مصباح HCl بشدّة بينما خفت مصباح حمض الخليك، رغم أن تركيز المحلولين متساوٍ. ما التفسير العلمي الدقيق؟", "en": "In the previous experiment the HCl lamp glowed brightly while the acetic acid lamp stayed dim, even though both solutions have equal concentration. What is the precise scientific explanation?"}, "options": [{"id": "D1A", "ar": "HCl يتأيّن كاملاً تقريباً فيطلق أيونات حرة كثيرة تحمل التيار، بينما لا يتأيّن من حمض الخليك إلا نحو 5%", "en": "HCl ionizes almost completely, releasing many free ions that carry current, while only about 5% of acetic acid ionizes", "verdict": "correct", "feedback": {"ar": "إجابة دقيقة. عدد الأيونات الحرّة في المحلول هو ما يحدّد التوصيل الكهربائي، ودرجة التأيّن هي جوهر مفهوم قوة الحمض.", "en": "Precisely. The number of free ions in solution determines electrical conductivity, and the degree of ionization is the essence of acid strength."}}, {"id": "D1B", "ar": "جزيء HCl أصغر حجماً فيتحرك في الماء أسرع من جزيء حمض الخليك", "en": "The HCl molecule is smaller, so it moves through water faster than the acetic acid molecule", "verdict": "inaccurate", "feedback": {"ar": "حجم الجزيء لا يفسّر الفرق — الجزيئات المتعادلة لا تحمل تياراً أصلاً مهما تحرّكت. الذي يحمل التيار هو الأيونات المشحونة، وهنا مربط الفرس.", "en": "Molecular size does not explain it — neutral molecules carry no current at all, however fast they move. Charged ions carry the current; that is the key."}}, {"id": "D1C", "ar": "حمض الخليك يحتوي على كربون، والكربون يعيق مرور الكهرباء في المحلول", "en": "Acetic acid contains carbon, and carbon obstructs electricity in solution", "verdict": "inaccurate", "feedback": {"ar": "وجود الكربون في الصيغة لا علاقة له بالتوصيل. الجرافيت الكربوني نفسه يُستخدم أقطاباً موصلة! العامل الحاسم هو نسبة الجزيئات المتفككة إلى أيونات.", "en": "Carbon in the formula has nothing to do with conductivity. Carbon graphite is itself used as a conducting electrode! The decisive factor is the fraction of molecules dissociated into ions."}}, {"id": "D1D", "ar": "محلول HCl أعلى تركيزاً في الواقع، والمختبر لم يضبط التركيزين جيداً", "en": "The HCl solution is actually more concentrated; the lab did not control the concentrations properly", "verdict": "misconception", "feedback": {"ar": "هذا هو الخلط الشائع بين القوة والتركيز. المحلولان مضبوطان عند 0.1 مولار بدقة. القوة صفة كيميائية للحمض ذاته تقاس بدرجة تأيّنه، لا بكمية ما ذاب منه.", "en": "This is the classic strength-vs-concentration confusion. Both solutions are precisely 0.1 M. Strength is a chemical property of the acid itself, measured by its ionization degree — not by how much was dissolved."}}]}, {"id": "D2", "question": {"ar": "أخذنا محلول HCl وخفّفناه بالماء حتى صار تركيزه 0.001 مولار فقط. ماذا يحدث لتصنيفه؟", "en": "We took the HCl solution and diluted it with water down to only 0.001 M. What happens to its classification?"}, "options": [{"id": "D2A", "ar": "يبقى حمضاً قويّاً لأن كل ما ذاب منه يتأيّن كاملاً، وإن قلّت كميته", "en": "It remains a strong acid because everything dissolved still ionizes completely, however small the amount", "verdict": "correct", "feedback": {"ar": "صحيح تماماً. لدينا الآن محلول مخفّف من حمض قوي. التخفيف يغيّر التركيز، لكنه لا يغيّر طبيعة الحمض ولا نسبة تأيّنه.", "en": "Exactly right. We now have a dilute solution of a strong acid. Dilution changes concentration, but it does not change the acid's nature or its ionization fraction."}}, {"id": "D2B", "ar": "يتحوّل إلى حمض ضعيف لأن عدد أيوناته في اللتر أصبح قليلاً", "en": "It becomes a weak acid because its ions per liter are now few", "verdict": "misconception", "feedback": {"ar": "هنا الفخ بعينه: قلة الأيونات بسبب التخفيف لا تجعل الحمض ضعيفاً. الضعف يعني أن الجزيئات نفسها ترفض التفكك. أما هنا فكل جزيء HCl موجود قد تفكك بالفعل بنسبة 100%.", "en": "Here is the trap itself: fewer ions due to dilution does not make an acid weak. Weakness means the molecules themselves resist dissociating. Here, every HCl molecule present has already dissociated, 100%."}}, {"id": "D2C", "ar": "يصبح متعادلاً لأن الماء الكثير يلغي حموضته", "en": "It becomes neutral because the abundant water cancels its acidity", "verdict": "inaccurate", "feedback": {"ar": "التخفيف يرفع pH نحو 7 تدريجياً لكنه لا يصل إلى التعادل التام ولا يلغي هوية الحمض. محلول 0.001 مولار من HCl حمضي بوضوح (pH ≈ 3).", "en": "Dilution raises pH toward 7 gradually but never reaches full neutrality nor erases the acid's identity. A 0.001 M HCl solution is clearly acidic (pH ≈ 3)."}}]}, {"id": "D3", "question": {"ar": "زميلك ركّز محلول حمض الخليك حتى وصل إلى 5 مولار (تركيز عالٍ جداً) وقال: الآن صار حمضاً قوياً مثل HCl. ما ردّك العلمي؟", "en": "Your colleague concentrated acetic acid up to 5 M (very high) and said: now it has become a strong acid like HCl. What is your scientific response?"}, "options": [{"id": "D3A", "ar": "كلامه غير صحيح: حمض الخليك يبقى ضعيفاً لأن نسبة تأيّنه تظل منخفضة مهما زاد التركيز", "en": "He is incorrect: acetic acid remains weak because its ionization fraction stays low no matter the concentration", "verdict": "correct", "feedback": {"ar": "ممتاز. صار لدينا محلول مركّز من حمض ضعيف — وهذان وصفان مستقلان تماماً. القوة تحددها Ka الثابتة للحمض، والتركيز يحدده مقدار ما أُذيب.", "en": "Excellent. We now have a concentrated solution of a weak acid — two entirely independent descriptions. Strength is fixed by the acid's Ka; concentration is set by how much was dissolved."}}, {"id": "D3B", "ar": "كلامه صحيح: التركيز العالي يرفع عدد الأيونات فيصبح الحمض قوياً", "en": "He is correct: high concentration raises the ion count, making the acid strong", "verdict": "misconception", "feedback": {"ar": "زيادة التركيز ترفع العدد المطلق للأيونات فعلاً، لكن النسبة المتأينة تبقى ضئيلة (بل تنخفض قليلاً عند التركيز الأعلى). القوة نسبة لا عدد، وKa لا تتغير بالتركيز.", "en": "Higher concentration does raise the absolute ion count, but the ionized fraction stays tiny (it even drops slightly at higher concentration). Strength is a ratio, not a count — and Ka does not change with concentration."}}, {"id": "D3C", "ar": "كلامه صحيح جزئياً: يصبح قوياً فقط إذا سخّناه مع التركيز", "en": "He is partially correct: it becomes strong only if we also heat it", "verdict": "inaccurate", "feedback": {"ar": "الحرارة تغيّر Ka تغييراً طفيفاً لكنها لا تنقل حمضاً من فئة الضعيف إلى فئة القوي. تصنيف القوة مرتبط ببنية الجزيء وميله الجوهري للتفكك.", "en": "Temperature shifts Ka slightly but never moves an acid from the weak class to the strong class. The strength classification is tied to molecular structure and its intrinsic tendency to dissociate."}}]}, {"id": "D4", "question": {"ar": "أمامك حمضان مجهولان بالتركيز نفسه: الحمض (أ) قيمته Ka = 6.3 × 10⁻⁵ والحمض (ب) قيمته Ka = 7.2 × 10⁻¹⁰. لو وصلنا كلاً منهما بدائرة المصباح، ماذا تتوقع؟", "en": "You have two unknown acids at equal concentration: acid (A) with Ka = 6.3 × 10⁻⁵ and acid (B) with Ka = 7.2 × 10⁻¹⁰. If we connect each to the lamp circuit, what do you expect?"}, "options": [{"id": "D4A", "ar": "مصباح الحمض (أ) أكثر إضاءة لأن Ka الأكبر تعني تأيناً أعلى وأيونات أكثر", "en": "Acid (A)'s lamp glows brighter, because larger Ka means higher ionization and more ions", "verdict": "correct", "feedback": {"ar": "استدلال محكم: قارنت القيمتين، وربطت Ka بدرجة التأيّن، ثم ربطت الأيونات بالتوصيل. هذه هي السلسلة المنطقية الكاملة التي بنينا عليها المشاهد كلها.", "en": "Sound reasoning: you compared the values, linked Ka to ionization degree, then linked ions to conduction. That is the complete logical chain underlying all our scenes."}}, {"id": "D4B", "ar": "مصباح الحمض (ب) أكثر إضاءة لأن الأس السالب الأكبر يعني قوة أكبر", "en": "Acid (B)'s lamp glows brighter, because the larger negative exponent means greater strength", "verdict": "misconception", "feedback": {"ar": "انتبه لقراءة الأسس السالبة: 10⁻¹⁰ أصغر بمئة ألف مرة من 10⁻⁵. الأس السالب الأكبر يعني قيمة أصغر، أي تأيناً أقل وحمضاً أضعف.", "en": "Watch how you read negative exponents: 10⁻¹⁰ is one hundred thousand times smaller than 10⁻⁵. A larger negative exponent means a smaller value — less ionization, weaker acid."}}, {"id": "D4C", "ar": "المصباحان متساويان لأن التركيز متساوٍ", "en": "Both lamps glow equally because the concentrations are equal", "verdict": "misconception", "feedback": {"ar": "عدنا إلى نقطة البداية: التركيز المتساوي لا يعني أيونات متساوية. الذي يحدد عدد الأيونات الحرة هو نسبة التأين، وهي تختلف بين الحمضين بمئة ألف ضعف وفق قيمتي Ka.", "en": "Back to square one: equal concentration does not mean equal ions. Free-ion count is set by the ionization fraction, which differs between these acids by a factor of one hundred thousand per the two Ka values."}}, {"id": "D4D", "ar": "لا يضيء أيٌّ من المصباحين لأن كلا الحمضين ضعيف", "en": "Neither lamp glows since both acids are weak", "verdict": "inaccurate", "feedback": {"ar": "حتى الحمض الضعيف يطلق بعض الأيونات فيمرّر تياراً خافتاً — رأينا ذلك في مصباح حمض الخليك الخافت. الضعف لا يعني انعدام التوصيل بل انخفاضه.", "en": "Even a weak acid releases some ions and passes a faint current — we saw that in the dim acetic acid lamp. Weakness means reduced conduction, not zero conduction."}}]}], "decisionPrompt": {"ar": "اختر التفسير الأصحّ", "en": "Choose the most accurate explanation"}, "tryAgainPrompt": {"ar": "أعد المحاولة بعد قراءة التصحيح", "en": "Try again after reading the correction"}, "kaExplanation": {"title": {"ar": "ما معنى Ka = 1.8 × 10⁻⁵؟", "en": "What does Ka = 1.8 × 10⁻⁵ mean?"}, "definition": {"ar": "Ka هو ثابت تأيّن الحمض. يقيس مدى ميل الحمض إلى التفكّك إلى أيونات في الماء عند الاتزان. كلّما كبرت قيمة Ka دلّ ذلك على حمض أقوى (تأيّن أكبر)، وكلما صغرت دلّ ذلك على حمض أضعف (تأيّن أقلّ).", "en": "Ka is the acid ionization constant. It measures how readily an acid dissociates into ions in water at equilibrium. A larger Ka means a stronger acid (more ionization); a smaller Ka means a weaker acid (less ionization)."}, "forAcetic": {"ar": "القيمة 1.8 × 10⁻⁵ صغيرة جداً — وهذا يعني أن حمض الخليك يبقى في الغالب على صورة جزيئات غير متأيّنة، ولا يتفكّك منه إلى أيونات إلا نسبة قريبة من 5% فقط في الماء.", "en": "The value 1.8 × 10⁻⁵ is very small — this means acetic acid remains mostly as undissociated molecules; only about 5% of it actually ionizes in water."}, "comparison": {"ar": "بالمقابل، يمتلك حمض الهيدروكلوريك Ka ضخمة (تقريباً 10⁶)، فيتأيّن تأيّناً شبه كامل في الماء — وهنا الفرق الجوهري بين الحمض القوي والحمض الضعيف.", "en": "In contrast, hydrochloric acid has a huge Ka (about 10⁶), so it ionizes almost completely in water — this is the essential difference between a strong acid and a weak acid."}, "expressionLabel": {"ar": "تعبير ثابت التأيّن:", "en": "Ionization constant expression:"}}}, "scene3": {"code": "S3", "title": {"ar": "تحدّي تصنيف الأحماض والقواعد", "en": "Acid and Base Classification Challenge"}, "completionRule": "procedure-correct", "completionThreshold": {"minCorrect": 6, "totalItems": 8}, "narration": {"intro": {"ar": "وصلت إلى التحدّي. أمامك ثمانية أحماض وقواعد، وعليك أن تصنّف كلّ واحدة منها بين قويّة وضعيفة.", "en": "You have reached the challenge. Before you are eight acids and bases; classify each as strong or weak."}, "reminder": {"ar": "قاعدة سريعة قبل أن نبدأ: Ka وKb الكبيرة تعني تأيّناً أعلى، أي قوّة أعلى. والقيم الصغيرة تعني ضعفاً.", "en": "Quick rule before we begin: large Ka and Kb indicate higher ionization (stronger). Small values indicate weakness."}, "closure": {"ar": "ثمانية تصنيفات. لننتقل إلى التقييم الختاميّ.", "en": "Eight classifications complete. Let us move to the final assessment."}}, "ruleStrong": {"ar": "Ka أو Kb كبيرة ← قويّ", "en": "Large Ka or Kb ← Strong"}, "ruleWeak": {"ar": "Ka أو Kb صغيرة ← ضعيف", "en": "Small Ka or Kb ← Weak"}, "binStrong": {"ar": "قويّ", "en": "Strong"}, "binWeak": {"ar": "ضعيف", "en": "Weak"}, "items": [{"id": "V1", "formula": "HCl", "ar": "حمض الهيدروكلوريك", "en": "Hydrochloric acid", "constant": {"label": "Ka", "value": {"ar": "كبيرة جداً", "en": "very large"}}, "correct": "strong", "kvalueDisplay": "Ka ≈ 1.3 × 10⁶", "hint": {"ar": "من الأحماض السبعة القوية المعروفة", "en": "One of the seven well-known strong acids"}}, {"id": "V2", "formula": "HNO₃", "ar": "حمض النيتريك", "en": "Nitric acid", "constant": {"label": "Ka", "value": {"ar": "كبيرة جداً", "en": "very large"}}, "correct": "strong", "kvalueDisplay": "Ka ≈ 2.4 × 10¹", "hint": {"ar": "حمض قوي يستخدم في صناعة الأسمدة", "en": "A strong acid used in fertilizer production"}}, {"id": "V3", "formula": "H₂SO₄", "ar": "حمض الكبريتيك", "en": "Sulfuric acid", "constant": {"label": "Ka₁", "value": {"ar": "كبيرة جداً", "en": "very large"}}, "correct": "strong", "kvalueDisplay": "Ka₁ كبيرة جداً", "hint": {"ar": "ثنائي البروتون؛ تأينه الأول كامل", "en": "Diprotic; its first ionization is complete"}}, {"id": "V4", "formula": "CH₃COOH", "ar": "حمض الخليك", "en": "Acetic acid", "constant": {"label": "Ka", "value": "1.8 × 10⁻⁵"}, "correct": "weak", "kvalueDisplay": "Ka = 1.8 × 10⁻⁵", "hint": {"ar": "حمض الخل المنزلي", "en": "The acid of household vinegar"}}, {"id": "V5", "formula": "HF", "ar": "حمض الهيدروفلوريك", "en": "Hydrofluoric acid", "constant": {"label": "Ka", "value": "6.3 × 10⁻⁴"}, "correct": "weak", "kvalueDisplay": "Ka = 6.6 × 10⁻⁴", "hint": {"ar": "رغم شراسته على الزجاج فهو ضعيف التأين!", "en": "Despite etching glass, it ionizes weakly!"}}, {"id": "V6", "formula": "NaOH", "ar": "هيدروكسيد الصوديوم", "en": "Sodium hydroxide", "constant": {"label": "Kb", "value": {"ar": "كبيرة جداً", "en": "very large"}}, "correct": "strong", "kvalueDisplay": "تفكك تام", "hint": {"ar": "قاعدة أيونية تتفكك كلياً في الماء", "en": "An ionic base that fully dissociates in water"}}, {"id": "V7", "formula": "KOH", "ar": "هيدروكسيد البوتاسيوم", "en": "Potassium hydroxide", "constant": {"label": "Kb", "value": {"ar": "كبيرة جداً", "en": "very large"}}, "correct": "strong", "kvalueDisplay": "تفكك تام", "hint": {"ar": "قاعدة قلوية شائعة في الصابون الصلب", "en": "A common alkali in solid soap"}}, {"id": "V8", "formula": "NH₃", "ar": "الأمونيا", "en": "Ammonia", "constant": {"label": "Kb", "value": "1.8 × 10⁻⁵"}, "correct": "weak", "kvalueDisplay": "Kb = 1.8 × 10⁻⁵", "hint": {"ar": "تستقبل بروتوناً من الماء جزئياً فقط", "en": "Accepts a proton from water only partially"}}], "feedbackCorrect": {"ar": "أحسنت", "en": "Well done"}, "feedbackIncorrect": {"ar": "راجع القيمة", "en": "Re-check the value"}, "accuracyLabel": {"ar": "الدقّة", "en": "Accuracy"}, "summaryHeader": {"ar": "موجز التصنيف", "en": "Classification Summary"}}, "scene4": {"code": "S4", "title": {"ar": "التقييم الختاميّ والشهادة الرقميّة", "en": "Final Assessment and Digital Certificate"}, "completionRule": "quiz-pass", "completionThreshold": {"minCorrect": 5, "totalItems": 6}, "narration": {"intro": {"ar": "وصلت إلى آخر مرحلة. خمسة أسئلة قصيرة، وستحدّد ما أتقنته وما يستحقّ مراجعتك.", "en": "You have reached the final stage. Five short questions will determine what you have mastered and what deserves review."}, "guidance": {"ar": "قبل كل سؤال، حرّك المقياس لتُقدِّر مدى ثقتك بنفسك. هذه ليست درجة، بل مرآة.", "en": "Before each question, move the slider to estimate your confidence. This is not a grade — it is a mirror."}, "closure": {"ar": "هذه نتيجتك. لاحظ موضع قوّتك، ولاحظ ما يحتاج مراجعة. الإتقان رحلة، لا لحظة واحدة.", "en": "Here is your result. Notice your strengths, notice what needs review. Mastery is a journey, not a single moment."}}, "confidenceLabel": {"ar": "ما مدى ثقتك بإجابتك؟", "en": "How confident are you in your answer?"}, "confidenceLow": {"ar": "غير واثق", "en": "Not confident"}, "confidenceHigh": {"ar": "واثق تماماً", "en": "Fully confident"}, "submitAnswer": {"ar": "ثبّت الإجابة", "en": "Submit Answer"}, "questions": [{"id": "Q1", "loCode": "LO1", "text": {"ar": "محلولان بالتركيز نفسه: الأول لحمض يتأين بنسبة 100% والثاني لحمض يتأين بنسبة 2%. أي وصف علمي يفرّق بينهما بدقة؟", "en": "Two solutions at equal concentration: the first of an acid that ionizes 100%, the second of an acid that ionizes 2%. Which scientific description distinguishes them precisely?"}, "options": [{"id": "Q1A", "ar": "الأول حمض قوي والثاني حمض ضعيف", "en": "The first is a strong acid; the second is a weak acid", "correct": true, "rationale": {"ar": "درجة التأين هي المعيار الوحيد لتصنيف القوة: التأين الكامل قوة، والجزئي ضعف.", "en": "Ionization degree is the sole criterion of strength: complete ionization is strength; partial is weakness."}}, {"id": "Q1B", "ar": "الأول حمض مركّز والثاني حمض مخفّف", "en": "The first is concentrated; the second is dilute", "correct": false, "rationale": {"ar": "التركيز متساوٍ بنص السؤال؛ الخلط بين التركيز والقوة هو الخطأ الشائع الذي صُمم السؤال لكشفه.", "en": "Concentration is equal per the question; conflating concentration with strength is the very misconception this question targets."}}, {"id": "Q1C", "ar": "الأول أكثر حموضة في الطعم فقط دون فرق كيميائي", "en": "The first merely tastes more sour, with no chemical difference", "correct": false, "rationale": {"ar": "الفرق كيميائي جوهري: عدد الأيونات الحرة يختلف خمسين ضعفاً، ويظهر في التوصيل وpH وسرعة التفاعل.", "en": "The difference is fundamentally chemical: free-ion counts differ fifty-fold, visible in conductivity, pH, and reaction rate."}}, {"id": "Q1D", "ar": "لا يمكن التفريق دون معرفة لون كل محلول", "en": "They cannot be distinguished without knowing each solution's color", "correct": false, "rationale": {"ar": "اللون لا علاقة له بقوة الحمض؛ معظم محاليل الأحماض عديمة اللون أصلاً.", "en": "Color has nothing to do with acid strength; most acid solutions are colorless anyway."}}]}, {"id": "Q2", "loCode": "LO3", "text": {"ar": "أربعة أحماض بقيم Ka التالية. رتّبنا ثلاثة منها من الأقوى إلى الأضعف — أيّ ترتيب صحيح؟", "en": "Four acids with the following Ka values. Which ordering from strongest to weakest is correct?"}, "contextData": "HF: Ka = 6.6 × 10⁻⁴ · HCN: Ka = 6.2 × 10⁻¹⁰ · CH₃COOH: Ka = 1.8 × 10⁻⁵", "options": [{"id": "Q2A", "ar": "HF ثم CH₃COOH ثم HCN", "en": "HF then CH₃COOH then HCN", "correct": true, "rationale": {"ar": "نقارن القيم: 10⁻⁴ أكبر من 10⁻⁵ أكبر من 10⁻¹⁰. القيمة الأكبر تعني التأين الأعلى والقوة الأكبر.", "en": "Compare the values: 10⁻⁴ > 10⁻⁵ > 10⁻¹⁰. The larger value means higher ionization and greater strength."}}, {"id": "Q2B", "ar": "HCN ثم CH₃COOH ثم HF", "en": "HCN then CH₃COOH then HF", "correct": false, "rationale": {"ar": "هذا ترتيب معكوس ناتج عن قراءة الأس السالب الأكبر كقيمة أكبر — وهو عكس الصواب.", "en": "This is the reversed order, caused by reading the larger negative exponent as a larger value — the opposite of correct."}}, {"id": "Q2C", "ar": "CH₃COOH ثم HF ثم HCN", "en": "CH₃COOH then HF then HCN", "correct": false, "rationale": {"ar": "قُدِّم حمض الخليك على HF خطأً: 1.8 × 10⁻⁵ أصغر من 6.6 × 10⁻⁴ بنحو 37 مرة.", "en": "Acetic acid was wrongly placed above HF: 1.8 × 10⁻⁵ is about 37 times smaller than 6.6 × 10⁻⁴."}}, {"id": "Q2D", "ar": "الثلاثة متساوية لأن جميعها أحماض ضعيفة", "en": "All three are equal since all are weak acids", "correct": false, "rationale": {"ar": "حتى داخل فئة الأحماض الضعيفة تتفاوت القوة تفاوتاً هائلاً؛ Ka هي أداة المقارنة الكمية داخل الفئة الواحدة.", "en": "Even within the weak-acid class, strength varies enormously; Ka is the quantitative comparison tool within a single class."}}]}, {"id": "Q3", "loCode": "LO5", "text": {"ar": "مصنع يستخدم خزاناً ضخماً من حمض الخليك بتركيز 17 مولار (شبه نقي). موظف السلامة كتب في التقرير: «هذا الخزان يحوي حمضاً قوياً». ما تقييمك لعبارته؟", "en": "A factory uses a huge tank of 17 M (nearly pure) acetic acid. The safety officer wrote: 'This tank contains a strong acid.' How do you evaluate his statement?"}, "options": [{"id": "Q3A", "ar": "عبارة خاطئة علمياً: هو حمض ضعيف مركّز، وخطورته من تركيزه لا من قوته", "en": "Scientifically wrong: it is a concentrated weak acid; its danger comes from concentration, not strength", "correct": true, "rationale": {"ar": "التصنيف العلمي الدقيق ضروري حتى في سياق السلامة: الخطورة الفيزيائية للتركيز العالي حقيقية، لكن وصف «قوي» مصطلح كيميائي محجوز لدرجة التأين.", "en": "Precise classification matters even in safety contexts: the physical hazard of high concentration is real, but 'strong' is a chemical term reserved for ionization degree."}}, {"id": "Q3B", "ar": "عبارة صحيحة: التركيز 17 مولار يجعله قوياً بالفعل", "en": "Correct: 17 M concentration does make it strong", "correct": false, "rationale": {"ar": "لا يوجد تركيز يحوّل حمضاً ضعيفاً إلى قوي؛ Ka لحمض الخليك تبقى 1.8 × 10⁻⁵ عند أي تركيز.", "en": "No concentration converts a weak acid into a strong one; acetic acid's Ka remains 1.8 × 10⁻⁵ at any concentration."}}, {"id": "Q3C", "ar": "عبارة صحيحة لأن الحمض شبه النقي يتأين كاملاً", "en": "Correct, because nearly pure acid ionizes completely", "correct": false, "rationale": {"ar": "العكس هو الصحيح: نسبة التأين تنخفض كلما زاد التركيز (أقل من 0.5% عند 17 مولار) لقلة الماء المتاح للتفاعل.", "en": "The opposite holds: ionization fraction decreases as concentration rises (under 0.5% at 17 M) due to less available water."}}, {"id": "Q3D", "ar": "لا يمكن الحكم دون قياس درجة الحرارة", "en": "Cannot judge without measuring temperature", "correct": false, "rationale": {"ar": "الحرارة تزحزح Ka قليلاً لكنها لا تنقل الحمض بين فئتي القوي والضعيف؛ التصنيف محسوم دونها.", "en": "Temperature nudges Ka slightly but never moves an acid between the strong and weak classes; the classification is settled without it."}}]}, {"id": "Q4", "loCode": "LO4", "text": {"ar": "محلولان قاعديان بالتركيز نفسه: NaOH وNH₃. وُصلا بدائرتي مصباح متطابقتين. ماذا نشاهد ولماذا؟", "en": "Two basic solutions at equal concentration: NaOH and NH₃, each connected to identical lamp circuits. What do we observe, and why?"}, "options": [{"id": "Q4A", "ar": "مصباح NaOH ساطع ومصباح NH₃ خافت، لأن NaOH يتفكك كلياً وNH₃ يتأين جزئياً", "en": "The NaOH lamp is bright and the NH₃ lamp dim, because NaOH dissociates fully while NH₃ ionizes partially", "correct": true, "rationale": {"ar": "مفهوم القوة ينطبق على القواعد كما على الأحماض: NaOH قاعدة قوية (تفكك أيوني تام) وNH₃ قاعدة ضعيفة (Kb = 1.8 × 10⁻⁵).", "en": "Strength applies to bases exactly as to acids: NaOH is a strong base (complete ionic dissociation) and NH₃ a weak base (Kb = 1.8 × 10⁻⁵)."}}, {"id": "Q4B", "ar": "المصباحان ساطعان بالتساوي لأن كليهما قاعدة", "en": "Both lamps equally bright since both are bases", "correct": false, "rationale": {"ar": "فئة «قاعدة» لا تعني توصيلاً متساوياً؛ الفيصل هو نسبة الجسيمات المتفككة إلى أيونات حرة.", "en": "The category 'base' does not imply equal conduction; the decider is the fraction of particles dissociated into free ions."}}, {"id": "Q4C", "ar": "مصباح NH₃ ساطع أكثر لأن جزيئه أصغر وأخف", "en": "The NH₃ lamp is brighter because its molecule is smaller and lighter", "correct": false, "rationale": {"ar": "جزيء NH₃ المتعادل لا يحمل تياراً مهما صغر؛ معظم جزيئات الأمونيا تبقى متعادلة في الماء.", "en": "A neutral NH₃ molecule carries no current however small; most ammonia molecules remain neutral in water."}}, {"id": "Q4D", "ar": "لا يضيء المصباحان لأن القواعد لا توصّل الكهرباء", "en": "Neither lamp glows because bases do not conduct electricity", "correct": false, "rationale": {"ar": "محاليل القواعد توصّل الكهرباء عبر أيوناتها (OH⁻ والكاتيونات) تماماً كمحاليل الأحماض.", "en": "Basic solutions conduct via their ions (OH⁻ and cations) just as acid solutions do."}}]}, {"id": "Q5", "loCode": "LO2", "text": {"ar": "قاعدة مجهولة قيست Kb لها فوُجدت 4.4 × 10⁻⁴، وقاعدة أخرى Kb لها 1.1 × 10⁻⁸. أي استنتاج تجريبي صحيح؟", "en": "An unknown base measured Kb = 4.4 × 10⁻⁴, and another base Kb = 1.1 × 10⁻⁸. Which experimental conclusion is correct?"}, "options": [{"id": "Q5A", "ar": "الأولى أقوى: ستعطي توصيلاً كهربائياً أعلى وpH أعلى عند التركيز نفسه", "en": "The first is stronger: it will give higher conductivity and higher pH at the same concentration", "correct": true, "rationale": {"ar": "Kb الأكبر تعني تأيناً أعلى، أي أيونات OH⁻ أكثر: توصيل أعلى وقاعدية أشد (pH أعلى).", "en": "Larger Kb means higher ionization — more OH⁻ ions: greater conductivity and stronger basicity (higher pH)."}}, {"id": "Q5B", "ar": "الثانية أقوى لأن رقم أُسّها أكبر", "en": "The second is stronger because its exponent number is larger", "correct": false, "rationale": {"ar": "الأس السالب الأكبر (−8 مقابل −4) يعني قيمة أصغر بعشرة آلاف مرة، أي قاعدة أضعف بكثير.", "en": "The larger negative exponent (−8 vs −4) means a value ten thousand times smaller — a far weaker base."}}, {"id": "Q5C", "ar": "كلتاهما قويتان لأن لهما قيمة Kb قابلة للقياس", "en": "Both are strong since both have measurable Kb", "correct": false, "rationale": {"ar": "وجود قيمة Kb محدودة هو بالضبط علامة القاعدة الضعيفة؛ القواعد القوية تتفكك تماماً ولا يُدرج لها ثابت اتزان عادةً.", "en": "Having a finite Kb is precisely the mark of a weak base; strong bases dissociate completely and usually have no listed equilibrium constant."}}, {"id": "Q5D", "ar": "لا علاقة لـ Kb بقوة القاعدة، فهي تقيس الذوبانية فقط", "en": "Kb is unrelated to base strength; it only measures solubility", "correct": false, "rationale": {"ar": "Kb هو ثابت تأين القاعدة تحديداً — تعريفه نسبة الجسيمات المتفاعلة مع الماء لإنتاج OH⁻، وليس له علاقة بالذوبانية.", "en": "Kb is specifically the base ionization constant — defined by the fraction reacting with water to yield OH⁻, unrelated to solubility."}}]}, {"id": "Q6", "loCode": "LO1", "text": {"ar": "في مختبرك أربعة أكواب بمحاليل مجهولة متساوية التركيز، وجهاز قياس التوصيل أعطى القراءات التالية بالميكروسيمنز: الكوب أ = 4200، الكوب ب = 180، الكوب ج = 4150، الكوب د = 95. أي تفسير يتسق مع هذه البيانات؟", "en": "Your lab has four cups of unknown solutions at equal concentration; the conductivity meter reads (in µS): Cup A = 4200, Cup B = 180, Cup C = 4150, Cup D = 95. Which interpretation fits the data?"}, "options": [{"id": "Q6A", "ar": "أ وج إلكتروليتات قوية (حمض/قاعدة/ملح قوي التفكك)، وب ود إلكتروليتات ضعيفة", "en": "A and C are strong electrolytes (fully dissociating acid/base/salt); B and D are weak electrolytes", "correct": true, "rationale": {"ar": "فجوة القراءات (آلاف مقابل مئات) هي البصمة التجريبية للفارق بين التفكك التام والجزئي عند تساوي التركيز.", "en": "The reading gap (thousands vs hundreds) is the experimental fingerprint of complete vs partial dissociation at equal concentration."}}, {"id": "Q6B", "ar": "أ وج محلولان مركّزان، وب ود محلولان مخفّفان", "en": "A and C are concentrated; B and D are dilute", "correct": false, "rationale": {"ar": "نص السؤال يثبّت التركيز متساوياً في الأكواب الأربعة؛ يبقى التفسير الوحيد للفجوة هو اختلاف درجة التفكك.", "en": "The question fixes concentration as equal across all four cups; the only remaining explanation for the gap is differing dissociation degree."}}, {"id": "Q6C", "ar": "ب ود ماء نقي تماماً", "en": "B and D are completely pure water", "correct": false, "rationale": {"ar": "الماء النقي يقرأ أقل من 1 ميكروسيمنز تقريباً؛ قراءات 95 و180 تدل على وجود أيونات قليلة، أي إلكتروليت ضعيف.", "en": "Pure water reads roughly under 1 µS; readings of 95 and 180 indicate some ions present — a weak electrolyte."}}, {"id": "Q6D", "ar": "الجهاز معطّل لأن القراءات يجب أن تتساوى عند تساوي التركيز", "en": "The meter is faulty, since equal concentrations must give equal readings", "correct": false, "rationale": {"ar": "هذا الافتراض هو المفهوم الخاطئ المركزي في الدرس كله: التركيز المتساوي لا يستلزم أيونات متساوية إطلاقاً.", "en": "That assumption is the central misconception of this whole lesson: equal concentration in no way entails equal ions."}}]}], "resultsTitle": {"ar": "موجز أدائك", "en": "Performance Summary"}, "accuracyLabel": {"ar": "الدقّة", "en": "Accuracy"}, "avgTimeLabel": {"ar": "متوسط زمن الإجابة", "en": "Average response time"}, "confidenceGapLabel": {"ar": "فجوة الوعي الذاتي", "en": "Self-awareness gap"}, "strongestLabel": {"ar": "الموضع الأقوى", "en": "Strongest area"}, "reviewLabel": {"ar": "يستحقّ المراجعة", "en": "Deserves review"}, "noWeakness": {"ar": "كلّ الأهداف أُتقنت", "en": "All objectives mastered"}, "certificateButton": {"ar": "استلام الشهادة الرقميّة", "en": "Receive Digital Certificate"}, "rationaleCorrectLabel": {"ar": "لماذا هذا هو الصحيح", "en": "Why this is correct"}, "rational /* ═══ 04 TEXT SAFETY ═══════════════════════════════════════════════════
 * The Quest browser's canvas fonts have been seen to drop U+207B (⁻) and
 * U+21CC (⇌), turning "10⁻⁵" into "10 ⁵". We load IBM Plex (which covers
 * them), then PROBE each glyph once. Only if a glyph is really missing do
 * we fall back to safe spellings (10^-5, ↔). Correct chemistry either way. */
const FONT = '"IBM Plex Sans Arabic", "IBM Plex Sans", system-ui, "Segoe UI", Tahoma, sans-serif';
const FONT_LATIN = '"IBM Plex Sans", "IBM Plex Sans Arabic", system-ui, "Segoe UI", sans-serif';

function probeGlyph(ch) {
  try {
    const c = document.createElement('canvas'); c.width = 72; c.height = 72;
    const x = c.getContext('2d');
    x.font = '56px ' + FONT_LATIN; x.fillStyle = '#000'; x.textBaseline = 'middle';
    x.fillText(ch, 8, 36);
    const d = x.getImageData(0, 0, 72, 72).data;
    let ink = 0; for (let i = 3; i < d.length; i += 4) if (d[i] > 40) ink++;
    const wCh = x.measureText(ch).width, wPua = x.measureText('\uE000').width;
    return ink > 6 && Math.abs(wCh - wPua) > 0.5;
  } catch (e) { return true; }
}
function runGlyphProbe() {
  GLYPH.supMinus = probeGlyph('\u207B');
  GLYPH.supDigit = probeGlyph('\u2075');
  GLYPH.sub = probeGlyph('\u2083');
  GLYPH.equil = probeGlyph('\u21CC');
}
const SUP_MAP = { '⁰': '0', '¹': '1', '²': '2', '³': '3', '⁴': '4', '⁵': '5', '⁶': '6', '⁷': '7', '⁸': '8', '⁹': '9', '⁻': '-', '⁺': '+' };
const SUB_MAP = { '₀': '0', '₁': '1', '₂': '2', '₃': '3', '₄': '4', '₅': '5', '₆': '6', '₇': '7', '₈': '8', '₉': '9' };
function S(text) {
  let s = String(text == null ? '' : text);
  if (!GLYPH.supMinus || !GLYPH.supDigit) {
    s = s.replace(/10\s*([⁻⁺⁰¹²³⁴⁵⁶⁷⁸⁹]+)/g, function (m, sup) {
      let out = ''; for (let i = 0; i < sup.length; i++) out += SUP_MAP[sup[i]] || '';
      return '10^' + out;
    });
    s = s.replace(/[⁻⁺⁰¹²³⁴⁵⁶⁷⁸⁹]/g, function (c) { return SUP_MAP[c] || c; });
  }
  if (!GLYPH.sub) s = s.replace(/[₀-₉]/g, function (c) { return SUB_MAP[c] || c; });
  if (!GLYPH.equil) s = s.replace(/⇌/g, '↔');
  return s;
}
function hasArabic(s) { return /[\u0600-\u06FF]/.test(String(s)); }

function initControllers() {

const NORMAL_M = new THREE.Matrix3();

    const m = hit.object;
    if (m.userData.ix.panel) {

/* ═══ 11 LOCOMOTION ════════════════════════════════════════════════════ */
const WALK = {
  speed: 1.5,
  bounds: { minX: -4.3, maxX: 4.3, minZ: -3.6, maxZ: 3.8 },
  keys: {}, snapCooldown: 0, fwd: new THREE.Vector3(), right: new THREE.Vector3(), up: new THREE.Vector3(0, 1, 0), moved: 0

function snapTurn(angle) {
  const before = headWorld(TMP.v1).clone();
  player.rotation.y += angle;
  player.updateMatrixWorld(true);
  const after = headWorld(TMP.v2);
  player.position.x += before.x - after.x;
  player.position.z += before.z - after.z;
}
function updateLocomotion(dt) {
  let mvx = 0, mvz = 0, turn = 0;
  if (State.mode === 'vr') {
    const session = renderer.xr.getSession();
    if (session && session.inputSources) {
      for (let i = 0; i < session.inputSources.length; i++) {
        const src = session.inputSources[i];
        if (!src.gamepad || !src.gamepad.axes) continue;
        const ax = src.gamepad.axes;
        const sx = ax.length >= 4 ? ax[2] : (ax[0] || 0), sy = ax.length >= 4 ? ax[3] : (ax[1] || 0);
        if (src.handedness === 'left') { mvx += sx; mvz += sy; }
        else if (src.handedness === 'right') turn = sx;
      }
    }
  } else if (!HUD.typing()) {
    const k = WALK.keys;
    mvx = (k.d || k.arrowright ? 1 : 0) - (k.a || k.arrowleft ? 1 : 0);
    mvz = (k.s || k.arrowdown ? 1 : 0) - (k.w || k.arrowup ? 1 : 0);
    const yawIn = (k.q ? 1 : 0) - (k.e ? 1 : 0);
    if (yawIn) player.rotation.y += yawIn * 1.6 * dt;
  }
  if (Math.abs(mvx) < 0.18) mvx = 0;
  if (Math.abs(mvz) < 0.18) mvz = 0;
  if (mvx || mvz) {
    const f = headForward(WALK.fwd);
    WALK.right.crossVectors(f, WALK.up);
    const sp = WALK.speed * dt;
    const ox = player.position.x, oz = player.position.z;
    player.position.addScaledVector(f, -mvz * sp);
    player.position.addScaledVector(WALK.right, mvx * sp);
    const h = headWorld(TMP.v3);
    const b = WALK.bounds;
    if (h.x < b.minX) player.position.x += b.minX - h.x;
    if (h.x > b.maxX) player.position.x -= h.x - b.maxX;
    if (h.z < b.minZ) player.position.z += b.minZ - h.z;
    if (h.z > b.maxZ) player.position.z -= h.z - b.maxZ;
    WALK.moved += Math.hypot(player.position.x - ox, player.position.z - oz);
    State.lastAction = performance.now();
  }
  WALK.snapCooldown = Math.max(0, WALK.snapCooldown - dt);
  if (State.mode === 'vr' && WALK.snapCooldown === 0 && Math.abs(turn) > 0.65) {
    snapTurn(-Math.sign(turn) * THREE.MathUtils.degToRad(State.settings.snapAngle));
    WALK.snapCooldown = 0.38;
    AudioFX.hover();
  }
}
window.addEventListener('keydown', function (e) {
  if (HUD.typing()) return;
  const k = e.key.toLowerCase();
  WALK.keys[k] = true;
  if (!SM.started) return;
  if (k === 'h') { Hints.showNext(true); HUD.openHelp(); }
  else if (k === 'm') HUD.toggleAudio();

/* ═══ 12 LAB ═══════════════════════════════════════════════════════════

function makeBench(w, d, x, z, height) {
  const hgt = height || 0.92;
  const g = new THREE.Group();
  box(w - 0.06, hgt - 0.12, d - 0.1, MAT.cabinet, 0, (hgt - 0.12) / 2 + 0.06, -0.02, g);
  box(w - 0.1, 0.06, d - 0.14, lam(0x2A3140), 0, 0.03, -0.02, g);
  const nDoors = Math.max(1, Math.round(w / 0.62));
  for (let i = 0; i < nDoors; i++) {
    const dw = (w - 0.1) / nDoors;
    const dx = -w / 2 + 0.05 + dw * (i + 0.5);
    box(dw - 0.02, hgt - 0.26, 0.015, MAT.cabinetDoor, dx, (hgt - 0.12) / 2 + 0.06, d / 2 - 0.06, g);
    box(0.12, 0.016, 0.02, MAT.handle, dx, hgt - 0.2, d / 2 - 0.045, g);
  }
  const top = box(w, 0.045, d, MAT.epoxy, 0, hgt - 0.0225, 0, g);
  top.userData.benchTop = true;
  g.add(contactShadow(w * 1.25, d * 1.9, 0.75));

}

function makeWire(points, color) {

  init: function () {
    this.W = 2048; this.H = 1024;
    this.panel = new Panel({ w: 3.6, pxW: this.W, pxH: this.H, bg: 'screen' });
    this.panel.paint = this.paint.bind(this);

    const bezel = box(3.68, 1.88, 0.05, std(0x0A0F1C, 0.4, 0.3), 0, 1.78, ROOM.back + 0.005);
    bezel.renderOrder = 0;

  },
  set: function (o) { Object.assign(this, o); this.draw(); },
  draw: function () { if (this.panel) this.panel.redraw(); },
  paint: function (ctx, W, H) {
    const rtl = isRTL();
    // background tone
    const bg = ctx.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, '#0E1730'); bg.addColorStop(1, '#0A1122');
    ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
    // top bar
    ctx.fillStyle = 'rgba(255,255,255,0.03)'; ctx.fillRect(0, 0, W, 132);
    ctx.fillStyle = 'rgba(148,163,184,0.18)'; ctx.fillRect(0, 132, W, 2);
    if (AmadLogo.complete && AmadLogo.naturalWidth) {
      const lh = 70, lw = lh * AmadLogo.naturalWidth / AmadLogo.naturalHeight;
      ctx.drawImage(AmadLogo, rtl ? W - 70 - lw : 70, 31, lw, lh);
    }
    // stepper at the far end
    const idx = State.sceneIdx;
    const n = 4, sw = 250;
    const base = rtl ? 90 : W - 90 - n * sw;
    for (let i = 0; i < n; i++) {
      const slot = rtl ? n - 1 - i : i;
      const cx = rtl ? base + slot * sw + sw - 26 : base + slot * sw + 26;
      const st = State.sceneStatus[i];
      const cy = 66;
      const ring = st === 'done' ? C.ok : (i === idx ? C.cyan : 'rgba(148,163,184,0.25)');
      ctx.beginPath(); ctx.arc(cx, cy, 20, 0, Math.PI * 2);
      ctx.fillStyle = st === 'done' ? C.ok : (i === idx ? 'rgba(34,211,238,0.16)' : 'rgba(255,255,255,0.03)'); ctx.fill();
      ctx.lineWidth = 3; ctx.strokeStyle = ring; ctx.stroke();
      if (st === 'done') Icon.check(ctx, cx, cy, 26, '#06281C');
      else if (st === 'locked' && i !== idx) Icon.lock(ctx, cx, cy + 2, 22, '#7B8AA5');
      else { ctx.fillStyle = i === idx ? C.cyan : C.ink3; font(ctx, 700, 22, true); ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.direction = 'ltr'; ctx.fillText(String(i + 1), cx, cy + 1); }
      ctx.fillStyle = i === idx ? C.ink : C.ink3; font(ctx, i === idx ? 600 : 500, 26);
      dirOf(ctx); ctx.textAlign = rtl ? 'right' : 'left'; ctx.textBaseline = 'middle';
      ctx.fillText(S(t(UI_TEXT.sceneShort[i])), rtl ? cx - 32 : cx + 32, cy + 1);
    }

    // left (start) column
    const colX = 90, colW = 1150;
    const x0 = mx(W, colX, colW);
    let y = 196;
    if (idx >= 0) {
      ctx.fillStyle = C.cyan; font(ctx, 600, 30);
      para(ctx, tf(UI_TEXT.sceneOf, { n: idx + 1, t: 4 }), x0, y, colW, 40, 'start');
    } else {
      ctx.fillStyle = C.cyan; font(ctx, 600, 30);
      para(ctx, t(UI_TEXT.obTitle), x0, y, colW, 40, 'start');
    }
    y += 58;
    ctx.fillStyle = C.ink; font(ctx, 700, 78);
    y = para(ctx, t(this.title || CONFIG.experience.title), x0, y, colW, 98, 'start');
    ctx.fillStyle = C.gold; rr(ctx, rtl ? x0 + colW - 120 : x0, y + 10, 120, 7, 4); ctx.fill();
    y += 52;
    if (this.brief) {
      ctx.fillStyle = C.ink2; font(ctx, 400, 42);
      y = para(ctx, t(this.brief), x0, y, colW, 62, 'start');
    }
    if (State.objective) {
      y = Math.max(y + 36, 720);
      rr(ctx, x0, y, colW, 170, 22);
      ctx.fillStyle = 'rgba(34,211,238,0.08)'; ctx.fill();
      ctx.strokeStyle = 'rgba(34,211,238,0.45)'; ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = C.cyan; font(ctx, 600, 28);
      para(ctx, t(UI_TEXT.objective) + (State.objectiveCount ? '  ·  ' + State.objectiveCount : ''), x0 + 36, y + 24, colW - 72, 38, 'start');
      ctx.fillStyle = C.ink; font(ctx, 600, 40);
      para(ctx, t(State.objective), x0 + 36, y + 72, colW - 72, 52, 'start');
    }

    // end column: mastery gate + scene widget
    const gX = mx(W, 1320, 640), gW = 640;
    let gy = 196;
    const reqs = State.requirements;
    if (reqs.length) {
      const allDone = Progress.allDone();
      const gh = 118 + reqs.length * 92 + 80;
      rr(ctx, gX, gy, gW, gh, 24);
      ctx.fillStyle = 'rgba(255,255,255,0.035)'; ctx.fill();
      ctx.strokeStyle = allDone ? 'rgba(52,211,153,0.6)' : 'rgba(148,163,184,0.25)'; ctx.lineWidth = 2; ctx.stroke();
      const ix = rtl ? gX + gW - 56 : gX + 56;
      Icon.lock(ctx, ix, gy + 56, 40, allDone ? C.ok : C.gold, allDone);
      ctx.fillStyle = C.ink; font(ctx, 700, 34);
      para(ctx, t(UI_TEXT.masteryTitle), rtl ? gX + 30 : gX + 100, gy + 34, gW - 130, 44, 'start');
      let ry = gy + 116;
      reqs.forEach(function (r) {
        const cxr = rtl ? gX + gW - 56 : gX + 56;
        ctx.beginPath(); ctx.arc(cxr, ry + 30, 20, 0, Math.PI * 2);
        if (r.done) { ctx.fillStyle = C.ok; ctx.fill(); Icon.check(ctx, cxr, ry + 30, 24, '#06281C'); }
        else { ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(148,163,184,0.5)'; ctx.stroke(); }

          ctx.fillText(r.progress, rtl ? gX + 30 : gX + gW - 30, ry + 30);
        }
        ry += 92;
      });
      ctx.fillStyle = allDone ? C.ok : C.ink3; font(ctx, 500, 26);
      para(ctx, allDone ? t(UI_TEXT.unlocked) + (idx < 3 && idx >= 0 ? ' — ' + t(UI_TEXT.sceneShort[idx + 1]) : '') : t(UI_TEXT.gateLockedMsg), gX + 30, ry + 6, gW - 60, 36, 'start');

/* Captions + notices. DOM on desktop; in the headset a single world-space
   strip that docks above the active panel (never covers it) or, when no
   panel is open, lazily follows the gaze well below the eye line.       */
const Captions = {
  node: null, until: 0, panel: null, target: new THREE.Vector3(), follow: new THREE.Vector3(), yaw: 0,
  init: function () {
    const self = this;
    this.panel = new Panel({ w: 1.0, pxW: 1200, pxH: 300, bg: 'none', depthWrite: false });
    this.panel.paint = function (ctx, W, H) { self.paintVR(ctx, W, H); };
    this.panel.mesh.renderOrder = 50;
    this.panel.material.depthTest = false;
    this.panel.mesh.visible = false;
    scene.add(this.panel.mesh);
    I18N.on(function () { self.refresh(); Notice.refresh(); VO.relang(); });
  },
  show: function (node, o) {
    o = o || {};
    this.node = node;
    const len = t(node).length;
    this.until = performance.now() + (o.duration || Math.max(5200, Math.min(15000, len * 75)));
    if (o.audio) { const self = this; o.audio.addEventListener('ended', function () { self.until = performance.now() + 900; }); this.until = performance.now() + 60000; }
    this.refresh();
  },
  hold: function (text) { this.node = text; this.until = Infinity; this.refresh(); },
  clear: function () { this.node = null; this.until = 0; this.refresh(); },
  refresh: function () {
    const on = State.settings.captions && this.node && performance.now() < this.until;
    $('captions').hidden = !on || State.mode === 'vr';
    if (on) $('captions-text').textContent = S(t(this.node));
    this.panel.redraw();
  },
  paintVR: function (ctx, W, H) {
    let y = H;
    const nt = Notice.active();
    const cap = State.settings.captions && this.node && performance.now() < this.until ? t(this.node) : '';
    if (cap) {
      font(ctx, 500, 38);
      const lines = wrap(ctx, cap, W - 90).slice(0, 3);
      const h = lines.length * 52 + 36;
      y -= h;
      rr(ctx, 10, y, W - 20, h, 22); ctx.fillStyle = 'rgba(6,10,22,0.9)'; ctx.fill();
      ctx.fillStyle = '#FFFFFF'; para(ctx, lines.join(' '), 45, y + 18, W - 90, 52, 'center');
      y -= 16;
    }
    if (nt) {
      font(ctx, 600, 36);
      const lines = wrap(ctx, t(nt.node), W - 170).slice(0, 2);
      const h = lines.length * 48 + 36;
      y -= h;
      const colr = nt.kind === 'ok' ? C.ok : nt.kind === 'bad' ? C.bad : nt.kind === 'hint' ? C.gold : C.cyan;
      rr(ctx, 60, y, W - 120, h, 22); ctx.fillStyle = 'rgba(17,26,47,0.97)'; ctx.fill();
      ctx.strokeStyle = colr; ctx.lineWidth = 3; ctx.stroke();
      const icx = isRTL() ? W - 105 : 105;
      if (nt.kind === 'ok') Icon.check(ctx, icx, y + h / 2, 40, colr);
      else if (nt.kind === 'bad') Icon.cross(ctx, icx, y + h / 2, 36, colr);
      else Icon.bulb(ctx, icx, y + h / 2, 44, colr);
      ctx.fillStyle = C.ink; para(ctx, lines.join(' '), isRTL() ? 90 : 140, y + 18, W - 230, 48, 'start');
    }
  },
  update: function (dt) {
    const cap = State.settings.captions && this.node && performance.now() < this.until;
    if (this.node && !cap && this._wasOn) { this._wasOn = false; this.refresh(); }
    if (cap) this._wasOn = true;
    const vis = State.mode === 'vr' && (cap || !!Notice.active());
    const m = this.panel.mesh;
    m.visible = vis;
    if (!vis) return;
    const focus = SM.focus && SM.focus.mesh && isShown(SM.focus.mesh) ? SM.focus : null;
    if (focus) {
      const fm = focus.mesh;
      fm.updateMatrixWorld();
      const top = TMP.v1.set(0, focus.hM / 2 + 0.2, 0.02).applyMatrix4(fm.matrixWorld);
      m.position.copy(top);
      m.quaternion.copy(fm.getWorldQuaternion(TMP.q));
      return;
    }
    const h = headWorld(TMP.v1), f = headForward(TMP.v2);
    this.target.set(h.x + f.x * 1.25, h.y - 0.52, h.z + f.z * 1.25);
    const d = m.position.distanceTo(this.target);
    if (d > 0.35 || !this._placed) { this.follow.copy(this.target); this._placed = true; }
    m.position.lerp(this.follow, Math.min(1, dt * 4));
    const want = Math.atan2(h.x - m.position.x, h.z - m.position.z);
    m.rotation.set(-0.35, want, 0, 'YXZ');
  }
};
const Notice = {

/* ═══ 15 SCENE MANAGER ═════════════════════════════════════════════════
 * Mastery gate: a scene calls SM.complete() only when its CONFIG
 * completion rule is satisfied. Only then does the next scene unlock. */
const SPAWN = { x: 0, z: 0.35, yaw: 0 };
const SM = {
  idx: -1, current: null, group: null, factories: [], started: false, focus: null, busy: false,
  init: function (factories) {
    this.factories = factories;
    this.group = new THREE.Group(); scene.add(this.group);
    const self = this;
    I18N.on(function () { if (self.current && self.current.relocalize) self.current.relocalize(); panels.forEach(function (p) { if (p.mesh.parent) p.redraw(); }); });
  },
  spawn: function () { return (this.current && this.current.spawn) || SPAWN; },
  clear: function () {
    VO.stopAll();
    if (this.current && this.current.dispose) this.current.dispose();
    this.current = null;
    cancelTimers('scene');
    disposeTree(this.group);
    while (this.group.children.length) this.group.remove(this.group.children[0]);
    IM.clearScene();
    this.focus = null;
    Board.widget = null;
  },
  run: function (builder, idx) {
    const self = this;
    this.busy = true;
    VO.stopAll();
    fadeTo(1, 0.35, function () {
      self.clear();
      self.idx = idx; State.sceneIdx = idx;
      if (idx >= 0) {
        State.sceneStatus[idx] = 'active';
        XAPI.log('experienced', 'scene-' + (idx + 1), null);
      }
      const s = builder.spawn || SPAWN;
      placePlayer(s.x, s.z, s.yaw);
      self.current = builder(self.group) || {};
      self.current.spawn = s;
      Progress.emit();
      Board.draw();
      fadeTo(0, 0.5, function () { self.busy = false; if (self.current.onEnter) self.current.onEnter(); });
    });
  },
  go: function (i) { if (i >= 0 && i < this.factories.length) this.run(this.factories[i], i); },
  /* Scene requirements met → celebrate, unlock, offer the next scene. */
  complete: function (o) {
    o = o || {};
    const idx = this.idx;
    if (State.sceneStatus[idx] === 'done') return;
    State.sceneStatus[idx] = 'done';
    if (idx + 1 < 4 && State.sceneStatus[idx + 1] === 'locked') State.sceneStatus[idx + 1] = 'unlocked';
    XAPI.log('completed', 'scene-' + (idx + 1), this.current && this.current.getResult ? this.current.getResult() : null);
    Progress.setObjective(null);
    Board.draw();
    if (idx >= 3) return;
    const self = this;
    later(o.delay || 0.6, function () { self.showCompleteCard(idx); }, 'scene');
  },
  showCompleteCard: function (idx) {
    const self = this;
    const p = new Panel({ w: 0.95, pxW: 1000, pxH: 640, interactive: true });
    let unlockK = 0;
    p.paint = function (ctx, W, H) {
      ctx.save(); ctx.translate(W / 2, 128);
      ctx.beginPath(); ctx.arc(0, 0, 62, 0, Math.PI * 2); ctx.fillStyle = C.ok; ctx.fill();
      Icon.check(ctx, 0, 0, 78, '#06281C', 11);
      ctx.restore();
      ctx.fillStyle = C.ink; font(ctx, 700, 50);
      para(ctx, t(UI_TEXT.sceneComplete), 60, 214, W - 120, 64, 'center');
      ctx.fillStyle = C.ink2; font(ctx, 400, 32);
      para(ctx, t(UI_TEXT.sceneCompleteBody), 60, 284, W - 120, 44, 'center');
      rr(ctx, 90, 350, W - 180, 130, 20);
      ctx.fillStyle = 'rgba(245,158,11,0.09)'; ctx.fill(); ctx.strokeStyle = 'rgba(245,158,11,0.5)'; ctx.lineWidth = 2; ctx.stroke();
      const rtl = isRTL();
      Icon.lock(ctx, rtl ? W - 150 : 150, 412, 46, C.gold, unlockK > 0.5);
      ctx.fillStyle = C.gold2; font(ctx, 600, 26);
      para(ctx, t(UI_TEXT.unlocked), rtl ? 110 : 200, 376, W - 310, 34, 'start');
      ctx.fillStyle = C.ink; font(ctx, 600, 27);
      para(ctx, tf(UI_TEXT.sceneOf, { n: idx + 2, t: 4 }) + ' — ' + t(CONFIG['scene' + (idx + 2)].title), rtl ? 110 : 200, 408, W - 310, 34, 'start');
      p.button({ id: 'next', x: W / 2 - 290, y: 504, w: 580, h: 96, label: CONFIG.ui.proceedNextScene, style: 'gold', size: 32, key: ['enter'] });
    };
    p.onPress = function (id) { if (id === 'next' && !self.busy) { AudioManager.stop(); self.go(idx + 1); } };
    this.group.add(p.mesh);
    placeInFront(p.mesh, 1.25, null, -0.12);
    p.show();
    this.focus = p;
    IM.setModal([p.mesh]);
    AudioFX.unlockGate();
    later(0.35, function () { tween({ dur: 0.4, update: function (k) { unlockK = k; p.redraw(); } }); }, 'scene');
    Hints.set('none');
  },
  restart: function () {
    XAPI.log('interacted', 'experience.restart', null);
    VO.reset();
    State.sceneStatus = ['active', 'locked', 'locked', 'locked'];
    State.results = { scene3Accuracy: null, assessment: null };
    State.certificateId = null;
    State.log = [];
    this.go(0);
  },
  update: function (dt) { if (this.current && this.current.update) this.current.update(dt); }
};
