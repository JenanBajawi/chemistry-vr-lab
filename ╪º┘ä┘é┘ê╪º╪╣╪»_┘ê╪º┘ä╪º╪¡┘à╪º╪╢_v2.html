    rr(ctx, 4, 4, W - 8, H - 8, 30); ctx.fillStyle = 'rgba(11,18,36,0.92)'; ctx.fill();
    ctx.fillStyle = C.cyan; font(ctx, 600, 32);
    para(ctx, tf(UI_TEXT.sceneOf, { n: idx + 1, t: 4 }), 60, 58, W - 120, 44, 'center');
    ctx.fillStyle = C.ink; font(ctx, 700, 52);
    para(ctx, t(CONFIG['scene' + (idx + 1)].title), 60, 128, W - 120, 66, 'center');
  };
  p.material.depthTest = false; p.mesh.renderOrder = 60;
  root.add(p.mesh);
  placeInFront(p.mesh, 1.6, null, 0.12);
  p.show();
  later(2.2, function () {
    const mat = p.material;
    tween({ dur: 0.5, update: function (k) { mat.opacity = 1 - k; }, done: function () { p.hide(); } });
  }, 'scene');
  return p;
}

/* ═══ 16 ONBOARDING ════════════════════════════════════════════════════
 * Practical, not textual: 1 point at a sphere (hover state) → 2 trigger it
 * (select + ✓) → 3 walk into a ring → 4 safety gate (CONFIG.ui.safety*). */
function letterOf(k) { return (LANG === 'ar' ? ['أ', 'ب', 'ج', 'د', 'هـ'] : ['A', 'B', 'C', 'D', 'E'])[k]; }

function buildOnboarding(root) {
  let step = 1, hoverTime = 0, orbDone = false, finished = false;
  const safety = { coat: false, goggles: false };
  Board.set({ title: UI_TEXT.obTitle, brief: CONFIG.introScreen.welcome, widget: null });
  Progress.setRequirements([]);
  Hints.set('onboarding');

  // Instruction panel
  const ip = new Panel({ w: 1.08, pxW: 1080, pxH: 640, interactive: true });
  ip.mesh.position.set(0, 1.74, -1.25);
  root.add(ip.mesh);
  ip.paint = function (ctx, W, H, p) {
    // step dots
    for (let i = 0; i < 4; i++) {
      const slot = isRTL() ? 3 - i : i;
      const x = W / 2 - 3 * 34 + slot * 68;
      pill(ctx, x - 22, 40, 44, 10, i + 1 < step ? C.ok : (i + 1 === step ? C.cyan : 'rgba(148,163,184,0.25)'));
    }
    ctx.fillStyle = C.ink3; font(ctx, 600, 26);
    para(ctx, tf(UI_TEXT.obStep, { n: step, t: 4 }), 60, 70, W - 120, 36, 'center');
    if (step <= 3) {
      const head = [UI_TEXT.ob1, UI_TEXT.ob2, UI_TEXT.ob3][step - 1];
      const sub = [UI_TEXT.ob1s, UI_TEXT.ob2s, UI_TEXT.ob3s][step - 1];
      ctx.fillStyle = C.ink; font(ctx, 700, 54);
      let y = para(ctx, t(head), 60, 150, W - 120, 70, 'center');
      ctx.fillStyle = C.ink2; font(ctx, 400, 34);
      para(ctx, t(sub), 90, y + 24, W - 180, 48, 'center');
      if (step === 3) p.button({ id: 'skip', x: W / 2 - 130, y: H - 120, w: 260, h: 80, label: UI_TEXT.obSkip, style: 'ghost', size: 30, key: ['enter'] });
      return;
    }
    // Step 4 — safety (content from CONFIG)
    ctx.fillStyle = C.ink; font(ctx, 700, 48);
    let y = para(ctx, t(CONFIG.ui.safetyTitle), 60, 120, W - 120, 60, 'center');
    ctx.fillStyle = C.ink2; font(ctx, 400, 30);
    y = para(ctx, t(CONFIG.ui.safetyNarration), 90, y + 10, W - 180, 42, 'center');
    const both = safety.coat && safety.goggles;
    const bw = 440, gx = W / 2 - bw - 12;
    [['coat', CONFIG.ui.safetyCoat], ['goggles', CONFIG.ui.safetyGoggles]].forEach(function (it, i) {
      const slot = isRTL() ? 1 - i : i;
      const done = safety[it[0]];
      p.button({ id: it[0], x: gx + slot * (bw + 24), y: y + 28, w: bw, h: 100, label: it[1], style: done ? 'correct' : 'option', size: 30, key: [String(i + 1)],
        badge: done ? function (c, x, yy, s) { Icon.check(c, x, yy, s, C.ok); } : String(i + 1) });
    });
    y += 150;
    ctx.fillStyle = C.ink3; font(ctx, 400, 25);
    y = para(ctx, t(State.mode === 'vr' ? UI_TEXT.obTipHelpVR : UI_TEXT.obTipHelpDK), 80, y, W - 160, 34, 'center');
    p.button({ id: 'enter', x: W / 2 - 250, y: H - 112, w: 500, h: 88, label: CONFIG.ui.safetyEnter, style: both ? 'gold' : 'disabled', disabled: !both, lockIcon: true, size: 32, key: ['enter'] });
  };
  ip.onPress = function (id) {
    if (id === 'skip') goStep(4);
    else if (id === 'coat' || id === 'goggles') wear(id);
    else if (id === 'enter') finish();
  };

  // Step 1–2: the glowing sphere
  const orbG = new THREE.Group(); orbG.position.set(0, 0, -1.05); root.add(orbG);
  const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.12, 1.0, 20), lam(0x243152));
  stem.position.y = 0.5; orbG.add(stem);
  orbG.add(contactShadow(0.5, 0.5, 0.6));
  const orbMat = new THREE.MeshLambertMaterial({ color: 0x22D3EE, emissive: 0x0B6A7A, emissiveIntensity: 0.6 });
  const orb = new THREE.Mesh(new THREE.SphereGeometry(0.09, 28, 20), orbMat);
  orb.position.y = 1.16; orbG.add(orb);
  const orbGlow = glowSprite(0x22D3EE, 0.45); orbGlow.position.copy(orb.position); orbGlow.material.opacity = 0.35; orbG.add(orbGlow);
  const orbOutline = makeOutline(orb, 1.28);
  const orbCheck = makeLabel([{ text: '✓', size: 110, color: '#06281C', latin: true }], { w: 0.14, pxW: 200, pxH: 200, bg: 'none',
    after: function () {} });
  orbCheck.paint = function (ctx, W, H) { ctx.beginPath(); ctx.arc(W / 2, H / 2, 90, 0, Math.PI * 2); ctx.fillStyle = C.ok; ctx.fill(); Icon.check(ctx, W / 2, H / 2, 120, '#06281C', 18); };
  orbCheck.redraw(); orbCheck.mesh.position.set(0, 1.4, 0); orbCheck.mesh.visible = false; orbG.add(orbCheck.mesh);
  let orbHovered = false;
  IM.add(orb, { highlight: orbOutline, onHover: function (h) { orbHovered = h; orbMat.emissiveIntensity = h ? 1.1 : 0.6; },
    onSelect: function () {
      if (step !== 2 || orbDone) return;
      orbDone = true; AudioFX.success();
      orbMat.color.setHex(0x34D399); orbMat.emissive.setHex(0x0E5C43);
      orbGlow.material.color.setHex(0x34D399);
      orbCheck.mesh.visible = true;
      XAPI.log('interacted', 'onboarding.trigger', null);
      later(0.9, function () { goStep(3); }, 'scene');
    } });

  // Step 3: floor ring
  const ring = floorRing(0.42, 0x22D3EE); ring.position.set(-1.0, 0, -0.35); ring.visible = false; root.add(ring);

  // Step 4: safety table + props (coat, goggles)
  const table = makeBench(1.7, 0.6, 0, -0.95, 0.86); table.visible = false; root.add(table);
  const props = {};
  function makeProp(kind, x) {
    const g = new THREE.Group(); g.position.set(x, 0.86, -0.95);
    const form = new THREE.Group();
    if (kind === 'coat') {
      const cm = lam(0xF7F7F5, { side: THREE.DoubleSide });
      const yoke = new THREE.Mesh(new THREE.CylinderGeometry(0.075, 0.092, 0.05, 16, 1, true), cm); yoke.position.y = 0.3; form.add(yoke);
      const torso = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.084, 0.15, 16, 1, true), cm); torso.position.y = 0.2; form.add(torso);
      const hem = new THREE.Mesh(new THREE.CylinderGeometry(0.084, 0.13, 0.16, 16, 1, true), cm); hem.position.y = 0.07; form.add(hem);
      [-1, 1].forEach(function (s) { const sl = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.02, 0.17, 10), cm); sl.position.set(s * 0.102, 0.23, 0); sl.rotation.z = s * 0.22; form.add(sl); });
      const plk = new THREE.Mesh(new THREE.BoxGeometry(0.006, 0.28, 0.004), lam(0xD8DEE5)); plk.position.set(0, 0.17, 0.083); form.add(plk);
      const hanger = new THREE.Mesh(new THREE.TorusGeometry(0.035, 0.006, 8, 16, Math.PI), MAT.steel); hanger.position.y = 0.36; form.add(hanger);
    } else {
      const lensMat = new THREE.MeshLambertMaterial({ color: 0x67E8F9, transparent: true, opacity: 0.6 });
      [-0.045, 0.045].forEach(function (x) { const l = new THREE.Mesh(new THREE.TorusGeometry(0.04, 0.016, 10, 20), lensMat); l.position.set(x, 0.07, 0); form.add(l); });
      const br = new THREE.Mesh(new THREE.BoxGeometry(0.03, 0.012, 0.012), lam(0x334155)); br.position.set(0, 0.07, 0); form.add(br);
      const strap = new THREE.Mesh(new THREE.TorusGeometry(0.1, 0.006, 6, 24, Math.PI), lam(0x334155)); strap.rotation.x = Math.PI / 2; strap.position.set(0, 0.07, -0.01); strap.rotation.z = Math.PI; form.add(strap);
    }
    g.add(form);
    const hl = new THREE.Mesh(new THREE.RingGeometry(0.17, 0.2, 40), basic(0x22D3EE, { transparent: true, opacity: 0.9 }));
    hl.rotation.x = -Math.PI / 2; hl.position.y = 0.004; hl.visible = false; g.add(hl);
    const chk = new Panel({ w: 0.1, pxW: 160, pxH: 160, bg: 'none' });
    chk.paint = function (ctx, W, H) { ctx.beginPath(); ctx.arc(W / 2, H / 2, 72, 0, Math.PI * 2); ctx.fillStyle = C.ok; ctx.fill(); Icon.check(ctx, W / 2, H / 2, 96, '#06281C', 14); };
    chk.redraw(); chk.mesh.position.set(0.14, 0.42, 0.05); chk.mesh.visible = false; g.add(chk.mesh);
    const lbl = makeLabel(function () { return [{ text: kind === 'coat' ? CONFIG.ui.safetyCoat : CONFIG.ui.safetyGoggles, size: 34, weight: 600 }]; }, { w: 0.34, pxW: 460, pxH: 90 });
    lbl.mesh.position.set(0, 0.012, 0.2); lbl.mesh.rotation.x = -Math.PI / 2 + 0.5; g.add(lbl.mesh);
    const proxy = new THREE.Mesh(new THREE.BoxGeometry(0.36, 0.5, 0.36), basic(0, { visible: false })); proxy.position.y = 0.22; g.add(proxy);
    IM.add(proxy, { highlight: hl, onSelect: function () { wear(kind); } });
    IM.enable(proxy, false);
    g.visible = false; root.add(g);
    props[kind] = { g: g, chk: chk, proxy: proxy };
  }
  makeProp('coat', -0.42); makeProp('goggles', 0.42);

  function wear(kind) {
    if (step !== 4 || safety[kind]) return;
    safety[kind] = true;
    AudioFX.success();
    props[kind].chk.mesh.visible = true;
    IM.enable(props[kind].proxy, false);
    XAPI.log('interacted', 'safety-check.' + kind, { worn: true });
    ip.redraw();

  }
  function goStep(n) {
    step = n;
    XAPI.log('experienced', 'onboarding.step-' + n, null);
    orbG.visible = n <= 2;
    ring.visible = n === 3;
    const four = n === 4;
    table.visible = four; props.coat.g.visible = four; props.goggles.g.visible = four;
    IM.enable(props.coat.proxy, four && !safety.coat); IM.enable(props.goggles.proxy, four && !safety.goggles);
    Progress.setObjective([UI_TEXT.ob1, UI_TEXT.ob2, UI_TEXT.ob3, CONFIG.ui.safetyTitle][n - 1]);

    if (n === 4) ip.mesh.position.set(0, 1.74, -1.45);
    ip.show();
    State.lastAction = performance.now();
  }
  function finish() {
    if (finished || !(safety.coat && safety.goggles)) return;
    finished = true;
    AudioFX.chime();
    XAPI.log('completed', 'safety-check', { coat: true, goggles: true });
    XAPI.log('completed', 'onboarding', null);
    SM.go(0);
  }

  return {
    onEnter: function () { VO.play('welcome'); goStep(1); AudioFX.ambientStart(); },   // once per session (VO 'once')
    update: function (dt) {
      const tm = clock.elapsedTime;
      orb.position.y = 1.16 + (State.settings.reducedMotion ? 0 : Math.sin(tm * 1.6) * 0.015);
      orbGlow.position.y = orb.position.y;
      orbGlow.material.opacity = 0.3 + (orbHovered ? 0.35 : 0) + Math.sin(tm * 3) * 0.05;
      if (step === 1 && orbHovered) { hoverTime += dt; if (hoverTime > 0.35) { AudioFX.success(); goStep(2); } }
      if (step === 3) {
        ring.userData.ring.material.opacity = 0.55 + Math.sin(tm * 4) * 0.25;
        const h = headWorld(TMP.v1);
        if (Math.hypot(h.x - ring.position.x, h.z - ring.position.z) < 0.42) { AudioFX.success(); goStep(4); }
      }
    }
  };
}

/* ═══ 17a SCENE 1 — Discovering strength through conductivity ════════ */
function buildScene1(root) {
  const cfg = CONFIG.scene1;
  const visited = {};
  let hypothesis = null, hypFirst = null, hypPanel = null, done = false;
  const stations = [];

  Board.set({ title: cfg.title, brief: function () { return t(cfg.narration.intro) + '\n' + t(cfg.narration.guidance); }, widget: s1Widget });
  Progress.setRequirements([
    { label: UI_TEXT.s1Req[0], done: false, progress: '0 / 3' },
    { label: UI_TEXT.s1Req[1], done: false }
  ]);
  Progress.setObjective(UI_TEXT.s1ObjStations, '0 / 3');
  Hints.set('s1Stations');

  function s1Widget(ctx, x, y, w, h) {
    if (h < 200) return;
    rr(ctx, x, y, w, Math.min(h, 330), 24); ctx.fillStyle = 'rgba(255,255,255,0.035)'; ctx.fill();
    ctx.fillStyle = C.ink; font(ctx, 700, 32);

    cfg.stations.forEach(function (st, i) {
      const ry = y + 90 + i * 76;

      ctx.fillStyle = C.purple2; font(ctx, 700, 32, true); ctx.direction = 'ltr';
      ctx.textAlign = rtl ? 'right' : 'left'; ctx.textBaseline = 'middle';
      ctx.fillText(S(st.formula), rtl ? x + w - 30 : x + 30, ry + 28);
      const v = visited[st.id];
      ctx.fillStyle = v ? (st.brightness === 'off' ? C.ink2 : C.gold2) : C.ink3; font(ctx, v ? 600 : 400, 30);
      dirOf(ctx); ctx.textAlign = rtl ? 'left' : 'right';
      ctx.fillText(S(v ? t(st.result) : t(UI_TEXT.pending)), rtl ? x + 30 : x + w - 30, ry + 28);
    });
  }

  const bench = makeBench(4.0, 0.8, 0, -1.75);
  root.add(bench);
  const topY = bench.userData.topY;
  const liquidColor = { S1A: 0xA78BFA, S1B: 0xF59E0B, S1C: 0x7DD3FC };
  const level = { full: { e: 16, speed: 0.34, ions: 10, glow: 1.0 }, dim: { e: 5, speed: 0.12, ions: 2, glow: 0.38 }, off: { e: 0, speed: 0, ions: 0, glow: 0 } };
  const sharedDot = new THREE.SphereGeometry(0.0045, 6, 5);

  cfg.stations.forEach(function (st, si) {

    const elMat = std(0x2D3748, 0.5, 0.2);
    [0.085, 0.155].forEach(function (x) { const e = new THREE.Mesh(new THREE.BoxGeometry(0.012, 0.22, 0.012), elMat); e.position.set(x, 0.13, -0.04); sg.add(e); });
    // battery
    const bat = new THREE.Group();
    bat.add(new THREE.Mesh(new THREE.BoxGeometry(0.055, 0.09, 0.035), lam(0x1F2937)));
    const stripe = new THREE.Mesh(new THREE.BoxGeometry(0.056, 0.026, 0.036), lam(0xB45309)); bat.add(stripe);
    bat.position.set(-0.21, 0.045, 0.02); sg.add(bat);
    // lamp
    const stand = new THREE.Mesh(new THREE.CylinderGeometry(0.006, 0.006, 0.17, 8), MAT.steel); stand.position.set(-0.05, 0.085, -0.04); sg.add(stand);
    const base = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.035, 0.012, 14), MAT.steel); base.position.set(-0.05, 0.006, -0.04); sg.add(base);
    const bulbMat = new THREE.MeshLambertMaterial({ color: 0x8C94A3, emissive: 0x000000, transparent: true, opacity: 0.95 });
    const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.024, 18, 14), bulbMat); bulb.position.set(-0.05, 0.212, -0.04); sg.add(bulb);
    const glow = glowSprite(0xFFD27A, 0.5); glow.position.copy(bulb.position); sg.add(glow);
    // wires (electron paths)
    const wires = [
      makeWire([new THREE.Vector3(-0.224, 0.095, 0.02), new THREE.Vector3(-0.21, 0.2, 0.0), new THREE.Vector3(-0.12, 0.245, -0.03), new THREE.Vector3(-0.05, 0.235, -0.04)], 0xB91C1C),
      makeWire([new THREE.Vector3(-0.038, 0.205, -0.04), new THREE.Vector3(0.03, 0.27, -0.04), new THREE.Vector3(0.085, 0.25, -0.04), new THREE.Vector3(0.085, 0.235, -0.04)], 0xB91C1C),
      makeWire([new THREE.Vector3(0.155, 0.235, -0.04), new THREE.Vector3(0.21, 0.2, 0.04), new THREE.Vector3(0.16, 0.06, 0.16), new THREE.Vector3(0.012, 0.022, 0.16), new THREE.Vector3(-0.18, 0.02, 0.1), new THREE.Vector3(-0.196, 0.095, 0.02)], 0x111827)
    ];
    wires.forEach(function (w) { sg.add(w); });
    // electrons (instanced) + ions in solution (instanced)

    const hit = new THREE.Mesh(new THREE.BoxGeometry(0.17, 0.16, 0.17), basic(0, { visible: false })); hit.position.copy(swBtn.position); sg.add(hit);

    // placard (tent card) — number + formula, ✓ when done
    const placard = makeLabel(function () { return [
      { text: st.label, size: 30, color: '#6B7280', weight: 600 },

    ]; }, { w: 0.26, pxW: 440, pxH: 220, after: function (ctx, W) { if (visited[st.id]) { ctx.beginPath(); ctx.arc(W - 44, 44, 28, 0, Math.PI * 2); ctx.fillStyle = '#059669'; ctx.fill(); Icon.check(ctx, W - 44, 44, 38, '#fff', 7); } } });
    placard.mesh.position.set(0.34, 0.07, 0.24); placard.mesh.rotation.set(-0.62, -0.3, 0, 'YXZ'); sg.add(placard.mesh);

    // info card (Focus state): appears on hover or proximity
    const info = new Panel({ w: 0.5, pxW: 720, pxH: 470 });
    info.paint = function (ctx, W, H) {
      ctx.fillStyle = C.ink3; font(ctx, 600, 28); para(ctx, t(st.label), 40, 26, W - 80, 36, 'start');
      ctx.fillStyle = C.gold2; font(ctx, 700, 64, true); para(ctx, st.formula, 40, 64, W - 80, 76, 'start', true);
      ctx.fillStyle = C.ink; font(ctx, 600, 34); para(ctx, t(st.chemicalName), 40, 146, W - 80, 44, 'start');
      if (st.id !== 'S1C') { ctx.fillStyle = C.ink2; font(ctx, 500, 28); para(ctx, t(UI_TEXT.concentration) + ':  0.1 M', 40, 198, W - 80, 38, 'start'); }
      if (visited[st.id]) { ctx.fillStyle = C.ink2; font(ctx, 400, 25); para(ctx, t(cfg.narration['station' + (si + 1)]), 40, 244, W - 80, 34, 'start'); }

    chip.mesh.position.set(0, 0.17, 0.25); sg.add(chip.mesh);

    const S1 = { st: st, sg: sg, L: L, info: info, placard: placard, chip: chip, hovered: false, glowK: 0, electrons: electrons, eU: eU, ions: ions, ionU: ionU, wires: wires, bulbMat: bulbMat, glow: glow, on: false };

        if (visited[st.id]) return;
        visited[st.id] = true;
        XAPI.log('interacted', 'scene1.switch.' + st.id, { response: 'circuit-closed' });
        blade.rotation.z = 0; swBtn.position.y -= 0.012; btnMat.color.setHex(0x7F1D1D); btnMat.emissive.setHex(0x000000);
        chip.mesh.visible = false; IM.enable(hit, false);
        AudioFX.zap();
        S1.on = true;
        if (L.glow > 0) { later(0.15, function () { AudioFX.lampOn(); }, 'scene'); electrons.visible = true; ions.visible = true; }
        tween({ dur: 0.9, update: function (k) {
          const flick = k < 0.35 ? (Math.sin(k * 90) * 0.5 + 0.5) : 1;
          S1.glowK = L.glow * k * flick;
        } });
        placard.redraw(); info.redraw();
        const n = Object.keys(visited).length;
        Progress.setReq(0, n >= 3, n + ' / 3');
        Progress.setObjective(n >= 3 ? UI_TEXT.s1ObjHyp : UI_TEXT.s1ObjStations, n >= 3 ? '' : n + ' / 3');
        Board.draw();
        // Voice: silence while the lamp reacts, then point to the next untested station.
        arrive(si);   // (in case the station was used without being approached first)
        Notice.show('ok', st.result, 2400);
        if (n >= 3) later(2.2, showHypothesis, 'scene');
      } });
  });

  /* Voice: the learner reaches (approaches or points at) a station → its clip, once. */
  const STATION_CUE = { S1A: 's1.hcl', S1B: 's1.acetic', S1C: 's1.water' };
  function arrive(si) { VO.play(STATION_CUE[cfg.stations[si].id], 'queue'); }

  function showHypothesis() {
    Hints.set('s1Hyp');
    VO.play('s1.hypothesis');
    const hp = new Panel({ w: 1.22, pxW: 1152, pxH: 1120, interactive: true });
    hypPanel = hp;
    hp.paint = function (ctx, W, H, p) {
      ctx.fillStyle = C.cyan; font(ctx, 600, 28);
      para(ctx, t(UI_TEXT.s1ObjHyp), 70, 46, W - 140, 38, 'start');
      ctx.fillStyle = C.ink; font(ctx, 700, 46);
      let y = para(ctx, t(cfg.hypothesisQuestion), 70, 92, W - 140, 60, 'start');
      ctx.fillStyle = C.ink2; font(ctx, 400, 28);
      y = para(ctx, t(cfg.narration.hypothesis), 70, y + 8, W - 140, 40, 'start') + 24;
      cfg.hypotheses.forEach(function (h, i) {
        const b = { id: h.id, x: 70, y: y, w: W - 140, label: h, size: 29, align: 'start', badge: letterOf(i), key: [String(i + 1)],
          style: hypothesis && hypothesis.id === h.id ? (h.kind === 'correct' ? 'correct' : 'selected') : 'option' };
        b.h = measureButton(ctx, b);
        p.button(b); y += b.h + 14;
      });
      if (hypothesis) {
        y += 6;
        const ok = hypothesis.kind === 'correct';
        font(ctx, 400, 28);
        const rl = wrap(ctx, t(hypothesis.rationale), W - 220);
        const bh = 84 + rl.length * 40;
        rr(ctx, 70, y, W - 140, bh, 20);
        ctx.fillStyle = ok ? 'rgba(52,211,153,0.09)' : 'rgba(245,158,11,0.09)'; ctx.fill();
        ctx.strokeStyle = ok ? 'rgba(52,211,153,0.55)' : 'rgba(245,158,11,0.55)'; ctx.lineWidth = 2; ctx.stroke();
        ctx.fillStyle = ok ? C.ok : C.gold2; font(ctx, 700, 30);
        para(ctx, t(ok ? UI_TEXT.hypConsistent : UI_TEXT.hypRethink), 110, y + 20, W - 220, 40, 'start');
        ctx.fillStyle = C.ink; font(ctx, 400, 28);
        para(ctx, rl.join(' '), 110, y + 66, W - 220, 40, 'start');
        y += bh + 18;
        ctx.fillStyle = C.ink3; font(ctx, 400, 25);
        para(ctx, t(UI_TEXT.hypChange), 70, y, W - 140, 34, 'center');
        p.button({ id: 'continue', x: W / 2 - 220, y: H - 110, w: 440, h: 84, label: CONFIG.ui.continue, style: 'gold', size: 32, key: ['enter'] });
      }
    };
    hp.onPress = function (id) {
      if (id === 'continue') { finishScene(); return; }
      const h = cfg.hypotheses.find(function (x) { return x.id === id; });
      if (!h || done) return;
      hypothesis = h;
      if (!hypFirst) hypFirst = h;
      XAPI.log('answered', 'scene1.hypothesis', { response: h.id, kind: h.kind });
      if (h.kind === 'correct') { AudioFX.success(); VO.play('s1.correct'); }
      else { AudioFX.error(); if (h.kind === 'misconception') VO.play('s1.wrong_concentration'); }   // H1 = concentration
      Progress.setReq(1, true);
      hp.redraw();
    };
    hp.mesh.position.set(0, 1.6, -1.12);
    root.add(hp.mesh);
    stations.forEach(function (s) { s.info.hide(); });
    hp.show();
    SM.focus = hp;
    IM.setModal([hp.mesh]);
    XAPI.log('experienced', 'scene1.hypothesis-panel-revealed', null);
  }
  function finishScene() {
    if (done || !hypothesis) return;
    done = true;
    XAPI.log('completed', 'scene1.hypothesis', { first: hypFirst && hypFirst.id, final: hypothesis.id });
    hypPanel.hide(); IM.setModal(null); SM.focus = null;
    Board.set({ brief: function () { return t(cfg.summary) + '\n' + t(cfg.narration.closure); } });
    SM.complete({ delay: 1.2 });
  }

  const dm = new THREE.Object3D();
  return {
    onEnter: function () {
      sceneTitleCard(0, root);
      VO.play('s1.intro');
      VO.play('s1.guidance', 'queue');
    },
    update: function (dt) {
      const h = headWorld(TMP.v1).clone();
      const rm = State.settings.reducedMotion ? 0.35 : 1;
      stations.forEach(function (s) {
        // Focus: show the info card on hover or when close, unless a modal is open
        const p = s.sg.getWorldPosition(TMP.v2);
        const near = Math.hypot(h.x - p.x, h.z - p.z) < 1.3;
        const want = !hypPanel && (s.hovered || near);
        if (want && !s.info.mesh.visible) { s.info.show(); arrive(stations.indexOf(s)); }
        else if (!want && s.info.mesh.visible) s.info.hide();
        if (s.info.mesh.visible) faceYawTo(s.info.mesh, h);
        // lamp
        s.bulbMat.emissive.setRGB(1.0 * s.glowK, 0.78 * s.glowK, 0.35 * s.glowK);
        s.glow.material.opacity = Math.min(1, s.glowK * 0.95);
        s.glow.scale.setScalar(0.12 + s.glowK * 0.42);
        if (!s.on || s.L.glow === 0) return;
        const tm = clock.elapsedTime;
        // electrons along wires
        const per = s.L.e;
        for (let w = 0; w < 3; w++) for (let i = 0; i < per; i++) {
          const idx = w * per + i;
          s.eU[idx] = (s.eU[idx] + dt * s.L.speed * rm) % 1;
          dm.position.copy(s.wires[w].userData.curve.getPointAt(s.eU[idx]));
          dm.updateMatrix(); s.electrons.setMatrixAt(idx, dm.matrix);
        }
        s.electrons.instanceMatrix.needsUpdate = true;
        // ions drift between electrodes (cations → one side, anions → the other)
        s.ionU.forEach(function (u, i) {
          u.p = (u.p + dt * 0.25 * rm) % 1;
          const x = u.s > 0 ? 0.095 + u.p * 0.05 : 0.145 - u.p * 0.05;
          dm.position.set(x, u.y + Math.sin(tm * 3 + i) * 0.004, -0.04 + u.z * 0.6);
          dm.updateMatrix(); s.ions.setMatrixAt(i, dm.matrix);
        });
        s.ions.instanceMatrix.needsUpdate = true;
      });
    },
    relocalize: function () { Board.draw(); },
    getResult: function () { return { visited: Object.keys(visited), hypothesis: hypothesis ? hypothesis.id : null, firstHypothesis: hypFirst ? hypFirst.id : null }; }
  };
}

/* ═══ 17b SCENE 2 — Ionization and concentration ═════════════════════ */
function buildScene2(root) {
  const cfg = CONFIG.scene2;
  const ka = cfg.kaExplanation;
  const attempts = {};
  const observed = { left: false, right: false };
  let mode = 'observe', conceptTab = 'ka', conceptReturn = 'decision', conceptSeen = false;
  let dIdx = 0, picked = null, wrongSet = {}, correctCount = 0, done = false;

  Board.set({ title: cfg.title, brief: cfg.narration.intro, widget: s2Widget });
  Progress.setRequirements([
    { label: UI_TEXT.s2Req[0], done: false, progress: '0 / 2' },
    { label: UI_TEXT.s2Req[1], done: false, progress: '0 / ' + cfg.decisions.length }
  ]);
  Progress.setObjective(UI_TEXT.s2ObjObserve, '0 / 2');
  Hints.set('s2Observe');

  function s2Widget(ctx, x, y, w, h) {
    if (!(observed.left || observed.right) || h < 200) return;
    rr(ctx, x, y, w, 300, 24); ctx.fillStyle = 'rgba(255,255,255,0.035)'; ctx.fill();
    [['left', cfg.leftTank, C.cyan], ['right', cfg.rightTank, C.gold]].forEach(function (r, i) {
      const ry = y + 40 + i * 130;
      ctx.fillStyle = C.ink; font(ctx, 600, 30);
      para(ctx, t(r[1].label), x + 30, ry, w - 60, 40, 'start');
      rr(ctx, x + 30, ry + 56, w - 60, 26, 13); ctx.fillStyle = 'rgba(148,163,184,0.18)'; ctx.fill();
      if (observed[r[0]]) {
        const bw = Math.max(26, (w - 60) * r[1].ionizationRatio);
        rr(ctx, isRTL() ? x + w - 30 - bw : x + 30, ry + 56, bw, 26, 13); ctx.fillStyle = r[2]; ctx.fill();
      }
    });
  }

  /* --- the two tanks with a particle model (InstancedMesh, 20 units each) */
  const N = 20;
  const tanks = [];
  const catGeo = new THREE.SphereGeometry(0.022, 12, 8);
  [['left', -1.5, cfg.leftTank], ['right', 1.5, cfg.rightTank]].forEach(function (d) {
    const side = d[0], x = d[1], tank = d[2];
    const ped = new THREE.Mesh(new THREE.CylinderGeometry(0.42, 0.46, 0.8, 32), MAT.cabinet);
    ped.position.set(x, 0.4, -2.0); root.add(ped);
    const cap = new THREE.Mesh(new THREE.CylinderGeometry(0.43, 0.43, 0.03, 32), MAT.epoxy); cap.position.set(x, 0.8, -2.0); root.add(cap);
    const band = new THREE.Mesh(new THREE.CylinderGeometry(0.465, 0.465, 0.02, 32, 1, true), basic(side === 'left' ? 0x22D3EE : 0xF59E0B)); band.position.set(x, 0.72, -2.0); root.add(band);
    const sh = contactShadow(1.3, 1.3, 0.7); sh.position.set(x, 0.004, -2.0); root.add(sh);
    const beaker = makeBeaker(0.36, 0.66, side === 'left' ? 0x8B5CF6 : 0xF59E0B, 0.82);
    beaker.position.set(x, 0.815, -2.0); root.add(beaker);
    const outline = makeOutline(beaker.userData.glass, 1.05);

    // identity sticker (CONFIG chemicalName + kaLabel)
    const sticker = makeLabel(function () { return [
      { text: tank.chemicalName, size: 38 },
      { text: tank.kaLabel, size: 34, color: '#6D28D9', latin: !hasArabic(t(tank.kaLabel)) }
    ]; }, { w: 0.5, pxW: 700, pxH: 170 });
    sticker.mesh.position.set(x, 0.45, -2.0 + 0.465); root.add(sticker.mesh);

    const anR = side === 'left' ? 0.032 : 0.04;
    const cation = new THREE.InstancedMesh(catGeo, lam(0xffffff), N);
    const anion = new THREE.InstancedMesh(new THREE.SphereGeometry(anR, 12, 8), lam(0xffffff), N);
    root.add(cation); root.add(anion);
    const units = [];
    for (let i = 0; i < N; i++) {
      const a = Math.random() * Math.PI * 2, r = Math.sqrt(Math.random()) * 0.24;
      units.push({ c: new THREE.Vector3(x + Math.cos(a) * r, 0.9 + Math.random() * 0.42, -2.0 + Math.sin(a) * r),
        v: new THREE.Vector3((Math.random() - 0.5) * 0.02, (Math.random() - 0.5) * 0.02, (Math.random() - 0.5) * 0.02),
        dir: new THREE.Vector3(Math.random() - 0.5, Math.random() - 0.5, Math.random() - 0.5).normalize(),
        oc: new THREE.Vector3(), oa: new THREE.Vector3(), s: 0, target: 0, delay: 0, ph: Math.random() * 9 });
    }
    // exactly ionizationRatio × N units ionize (HCl 20/20, acetic 1/20 ≈ 5%)
    const nIon = Math.round(tank.ionizationRatio * N);
    const T = { side: side, x: x, tank: tank, cation: cation, anion: anion, units: units, nIon: nIon, count: 0, running: false, runT: 0, anR: anR, outline: outline };
    tanks.push(T);

    // counter / control panel above the tank
    const cp = new Panel({ w: 0.78, pxW: 900, pxH: 520, interactive: true });
    cp.paint = function (ctx, W, H, p) {
      ctx.fillStyle = side === 'left' ? C.cyan2 : C.gold2; font(ctx, 700, 50, true);
      para(ctx, tank.name, 40, 26, W - 80, 62, 'start', true);
      ctx.fillStyle = C.ink2; font(ctx, 600, 36, true);
      para(ctx, side === 'left' ? 'HCl  →  H⁺ + Cl⁻' : 'CH₃COOH  ⇌  H⁺ + CH₃COO⁻', 40, 96, W - 80, 48, 'start', true);
      ctx.fillStyle = C.ink3; font(ctx, 500, 28);
      para(ctx, t(UI_TEXT.ionized), 40, 168, W - 80, 36, 'start');
      ctx.fillStyle = C.ink; font(ctx, 700, 54, true);
      const m = /≈?\s*\d+\s*%/.exec(t(tank.label));
      const pct = T.running || observed[side] ? (observed[side] && !T.running && m ? m[0].replace(/\s+/g, ' ') : Math.round(T.count / N * 100) + '%') : '—';
      ctx.direction = 'ltr'; ctx.textBaseline = 'middle';
      ctx.textAlign = isRTL() ? 'right' : 'left'; ctx.fillText(T.count + ' / ' + N, isRTL() ? W - 40 : 40, 238);
      ctx.textAlign = isRTL() ? 'left' : 'right'; ctx.fillStyle = side === 'left' ? C.cyan : C.gold; ctx.fillText(S(pct), isRTL() ? 40 : W - 40, 238);
      rr(ctx, 40, 282, W - 80, 20, 10); ctx.fillStyle = 'rgba(148,163,184,0.2)'; ctx.fill();
      if (T.count) { const bw = Math.max(20, (W - 80) * T.count / N); rr(ctx, isRTL() ? W - 40 - bw : 40, 282, bw, 20, 10); ctx.fillStyle = side === 'left' ? C.cyan : C.gold; ctx.fill(); }
      // legend
      const lg = [[side === 'left' ? '#22D3EE' : '#22D3EE', UI_TEXT.legendCation], [side === 'left' ? '#A78BFA' : '#F472B6', UI_TEXT.legendAnion], ['#FDE68A', UI_TEXT.legendMolecule]];
      let lx = isRTL() ? W - 40 : 40;
      font(ctx, 500, 24);
      lg.forEach(function (l) {
        const tw = ctx.measureText(S(t(l[1]))).width;
        ctx.beginPath(); ctx.arc(isRTL() ? lx - 10 : lx + 10, 340, 10, 0, Math.PI * 2); ctx.fillStyle = l[0]; ctx.fill();
        ctx.fillStyle = C.ink2; dirOf(ctx); ctx.textAlign = isRTL() ? 'right' : 'left'; ctx.textBaseline = 'middle';
        ctx.fillText(S(t(l[1])), isRTL() ? lx - 28 : lx + 28, 341);
        lx += (isRTL() ? -1 : 1) * (tw + 64);
      });
      p.button({ id: 'run', x: 40, y: H - 124, w: W - 80, h: 92, label: observed[side] ? UI_TEXT.replay : UI_TEXT.runIon,
        style: observed[side] ? 'ghost' : 'primary', size: 32, icon: Icon.play, align: 'center', disabled: T.running, key: [side === 'left' ? '1' : '2'] });
    };
    cp.onPress = function (id) { if (id === 'run') run(T); };
    cp.mesh.position.set(x * 0.98, 1.86, -1.92);
    cp.mesh.rotation.y = x < 0 ? 0.42 : -0.42;
    root.add(cp.mesh); cp.redraw();
    T.panel = cp;
    const hit = new THREE.Mesh(new THREE.CylinderGeometry(0.38, 0.38, 0.7, 16), basic(0, { visible: false }));
    hit.position.set(x, 1.15, -2.0); root.add(hit);
    IM.add(hit, { highlight: outline, onSelect: function () { run(T); } });
    T.hit = hit;
  });

  function run(T) {
    if (T.running) return;
    T.running = true; T.runT = 0; T.count = 0;
    const order = T.units.map(function (u, i) { return i; }).sort(function () { return Math.random() - 0.5; });
    T.units.forEach(function (u) { u.s = 0; u.target = 0; u.oc.set(0, 0, 0); u.oa.set(0, 0, 0); });
    order.forEach(function (ui, k) { const u = T.units[ui]; if (k < T.nIon) { u.target = 1; u.delay = T.nIon === 1 ? 1.1 : 0.15 + k * 0.1; } });
    T.panel.redraw();
    XAPI.log('interacted', 'scene2.ionization.' + T.side, { ratio: T.tank.ionizationRatio });
    VO.play(T.side === 'left' ? 's2.hcl' : 's2.acetic', 'queue');
    AudioFX.zap();
  }
  function onRunDone(T) {
    T.running = false;
    if (!observed[T.side]) {
      observed[T.side] = true;
      const n = (observed.left ? 1 : 0) + (observed.right ? 1 : 0);
      Progress.setReq(0, n === 2, n + ' / 2');
      Progress.setObjective(n === 2 ? UI_TEXT.s2ObjConcept : UI_TEXT.s2ObjObserve, n === 2 ? '' : n + ' / 2');
      if (n === 2) { Board.set({ brief: cfg.narration.guidance }); Hints.set('s2Decide'); }
      AudioFX.success();
    }
    T.panel.redraw(); dp.redraw(); Board.draw();
  }

  /* --- central decision panel (modes: observe → concept → decision) */
  const dp = new Panel({ w: 1.2, pxW: 1152, pxH: 1220, interactive: true });
  dp.mesh.position.set(0, 1.56, -1.25);
  root.add(dp.mesh);
  dp.paint = function (ctx, W, H, p) {
    if (mode === 'observe') return paintObserve(ctx, W, H, p);
    if (mode === 'concept') return paintConcept(ctx, W, H, p);
    return paintDecision(ctx, W, H, p);
  };
  dp.onPress = function (id) {
    if (id === 'start') { mode = 'concept'; conceptReturn = 'decision'; conceptTab = 'ka'; conceptSeen = true; VO.play('s2.ka', 'queue'); VO.play('s2.strength_concentration', 'queue'); Progress.setObjective(UI_TEXT.s2ObjConcept); dp.redraw(); }
    else if (id === 'tab-ka' || id === 'tab-kb') { conceptTab = id.slice(4); XAPI.log('interacted', 'scene2.concept.' + conceptTab, null); dp.redraw(); }
    else if (id === 'concept') { conceptReturn = mode; mode = 'concept'; dp.redraw(); }
    else if (id === 'concept-back') { mode = conceptReturn; if (mode === 'decision') { VO.play('s2.questions', 'queue'); Progress.setObjective(UI_TEXT.s2ObjDecide, (dIdx + 1) + ' / ' + cfg.decisions.length); XAPI.log('experienced', 'scene2.decision.' + cfg.decisions[dIdx].id + '.presented', null); } dp.redraw(); }
    else if (id === 'retry') { picked = null; dp.redraw(); }
    else if (id === 'next') {
      picked = null; wrongSet = {};
      if (dIdx + 1 < cfg.decisions.length) { dIdx++; Progress.setObjective(UI_TEXT.s2ObjDecide, (dIdx + 1) + ' / ' + cfg.decisions.length); XAPI.log('experienced', 'scene2.decision.' + cfg.decisions[dIdx].id + '.presented', null); dp.redraw(); }
      else finish();
    }
    else if (mode === 'decision' && !picked) pick(id);
  };
  function paintObserve(ctx, W, H, p) {
    ctx.fillStyle = C.ink; font(ctx, 700, 50);
    let y = para(ctx, t(UI_TEXT.observeTitle), 70, 70, W - 140, 64, 'start');
    ctx.fillStyle = C.ink2; font(ctx, 400, 32);
    y = para(ctx, t(UI_TEXT.observeBody), 70, y + 12, W - 140, 46, 'start') + 36;
    [['left', cfg.leftTank], ['right', cfg.rightTank]].forEach(function (r) {
      const ok = observed[r[0]];
      rr(ctx, 70, y, W - 140, 104, 20);
      ctx.fillStyle = ok ? 'rgba(52,211,153,0.08)' : 'rgba(255,255,255,0.035)'; ctx.fill();
      ctx.strokeStyle = ok ? 'rgba(52,211,153,0.5)' : C.line; ctx.lineWidth = 2; ctx.stroke();
      const cx = isRTL() ? W - 124 : 124;
      ctx.beginPath(); ctx.arc(cx, y + 52, 24, 0, Math.PI * 2);
      if (ok) { ctx.fillStyle = C.ok; ctx.fill(); Icon.check(ctx, cx, y + 52, 30, '#06281C'); } else { ctx.strokeStyle = C.line2; ctx.lineWidth = 3; ctx.stroke(); }
      ctx.fillStyle = C.ink; font(ctx, 600, 32);
      para(ctx, t(r[1].chemicalName), isRTL() ? 110 : 170, y + 32, W - 400, 42, 'start');
      ctx.fillStyle = ok ? C.ok : C.ink3; font(ctx, 500, 26);
      dirOf(ctx); ctx.textAlign = isRTL() ? 'left' : 'right'; ctx.textBaseline = 'middle';
      ctx.fillText(S(t(ok ? UI_TEXT.observed : UI_TEXT.notObserved)), isRTL() ? 100 : W - 100, y + 53);
      y += 124;
    });
    const both = observed.left && observed.right;
    p.button({ id: 'start', x: W / 2 - 260, y: H - 140, w: 520, h: 92, label: UI_TEXT.startDecisions, style: both ? 'gold' : 'disabled', disabled: !both, lockIcon: true, size: 32, key: ['enter'] });
  }
  function chain(ctx, W, y, items, color) {
    const n = items.length, gap = 60, bw = (W - 140 - gap * (n - 1)) / n;
    items.forEach(function (it, i) {
      const slot = isRTL() ? n - 1 - i : i;
      const x = 70 + slot * (bw + gap);
      rr(ctx, x, y, bw, 84, 18); ctx.fillStyle = i === n - 1 ? 'rgba(245,158,11,0.14)' : 'rgba(34,211,238,0.09)'; ctx.fill();
      ctx.strokeStyle = i === n - 1 ? 'rgba(245,158,11,0.6)' : 'rgba(34,211,238,0.45)'; ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = i === n - 1 ? C.gold2 : C.ink; font(ctx, 700, 30);
      para(ctx, t(it), x + 10, y + 21, bw - 20, 40, 'center');
      if (i < n - 1) {
        const ax = isRTL() ? x - gap / 2 : x + bw + gap / 2;
        ctx.strokeStyle = C.ink3; ctx.lineWidth = 4; ctx.lineCap = 'round';
        const d = isRTL() ? -1 : 1;
        ctx.beginPath(); ctx.moveTo(ax - 14 * d, y + 42); ctx.lineTo(ax + 12 * d, y + 42); ctx.moveTo(ax + 2 * d, y + 32); ctx.lineTo(ax + 12 * d, y + 42); ctx.lineTo(ax + 2 * d, y + 52); ctx.stroke();
      }
    });
    return y + 84;
  }
  function paintConcept(ctx, W, H, p) {
    const tabW = 220;
    ['ka', 'kb'].forEach(function (tb, i) {
      const slot = isRTL() ? 1 - i : i;
      p.button({ id: 'tab-' + tb, x: 70 + slot * (tabW + 16), y: 40, w: tabW, h: 72, label: tb === 'ka' ? 'Ka' : 'Kb', latin: true, style: conceptTab === tb ? 'selected' : 'ghost', size: 34, r: 36, key: [String(i + 1)] });
    });
    let y = 150;
    if (conceptTab === 'ka') {
      ctx.fillStyle = C.gold2; font(ctx, 700, 44);

    const pass = c.correct >= cfg.completionThreshold.minCorrect;
    State.results.scene3Accuracy = Math.round(c.correct / items.length * 100);
    XAPI.log(pass ? 'passed' : 'failed', 'scene3.classification', { correct: c.correct, outOf: items.length, attempt: attempt });
    summaryOpen = true;
    if (pass) VO.play('s3.complete');
    card.show(); SM.focus = card;
    IM.setModal([card.mesh]);
  }
  function paintSummary(ctx, W, H, p) {
    const c = counts();
    const pass = c.correct >= cfg.completionThreshold.minCorrect;
    ctx.fillStyle = C.ink; font(ctx, 700, 42); para(ctx, t(cfg.summaryHeader), 50, 30, W - 100, 52, 'start');
    const acc = Math.round(c.correct / items.length * 100);
    ctx.fillStyle = C.ink3; font(ctx, 500, 26); para(ctx, t(cfg.accuracyLabel), 50, 90, 300, 34, 'start');
    ctx.fillStyle = pass ? C.ok : C.bad; font(ctx, 700, 44, true);

    ctx.fillText(acc + '%  (' + c.correct + ' / ' + items.length + ')', isRTL() ? 50 : W - 50, 100);
    rr(ctx, 50, 134, W - 100, 14, 7); ctx.fillStyle = 'rgba(148,163,184,0.2)'; ctx.fill();
    const bw = (W - 100) * acc / 100; rr(ctx, isRTL() ? W - 50 - bw : 50, 134, Math.max(14, bw), 14, 7); ctx.fillStyle = pass ? C.ok : C.bad; ctx.fill();
    const colW = (W - 100 - 20) / 2;
    items.forEach(function (it, i) {
      const col = i % 2, row = Math.floor(i / 2);
      const slot = isRTL() ? 1 - col : col;
      const x = 50 + slot * (colW + 20), y = 172 + row * 70;
      const r = placed[it.id];
      rr(ctx, x, y, colW, 60, 14); ctx.fillStyle = r && r.correct ? 'rgba(52,211,153,0.08)' : 'rgba(248,113,113,0.08)'; ctx.fill();

      ctx.fillStyle = C.ink2; font(ctx, 500, 24); dirOf(ctx); ctx.textAlign = isRTL() ? 'left' : 'right';
      ctx.fillText(S(t(r ? (r.bin === 'strong' ? cfg.binStrong : cfg.binWeak) : '')), isRTL() ? x + 20 : x + colW - 20, y + 31);
    });
    if (pass) {
      p.button({ id: 'continue', x: W / 2 - 220, y: H - 104, w: 440, h: 82, label: CONFIG.ui.continue, style: 'gold', size: 32, key: ['enter'] });
    } else {
      ctx.fillStyle = C.bad2; font(ctx, 500, 24); para(ctx, t(UI_TEXT.needMin), 50, H - 176, W - 100, 32, 'center');
      p.button({ id: 'retry', x: W / 2 - 220, y: H - 104, w: 440, h: 82, label: UI_TEXT.retry, style: 'primary', size: 32, key: ['enter'] });
    }
  }
  function retry() {
    summaryOpen = false; attempt++;
    card.hide(); SM.focus = null; IM.setModal(null);
    items.forEach(function (it) {
      const r = placed[it.id];
      if (r && !r.correct) {
        delete placed[it.id];
        const b = bottles[it.id];
        tweenVec3(b.g.position, b.g.userData.home, 0.7);
        b.g.userData.marker.visible = false;

    ['strong', 'weak'].forEach(function (k) { bins[k].n = items.filter(function (it) { return placed[it.id] && placed[it.id].bin === k; }).length; });
    const c = counts();
    counter.redraw();
    Progress.setReq(0, false, c.placed + ' / ' + items.length);
    Progress.setReq(1, c.correct >= cfg.completionThreshold.minCorrect, c.correct + ' / ' + cfg.completionThreshold.minCorrect);
    Progress.setObjective(UI_TEXT.s3ObjPick, c.placed + ' / ' + items.length);
  }
  function finish() {
    if (done) return;
    done = true;
    card.hide(); IM.setModal(null); SM.focus = null;

  }

  return {
    onEnter: function () {
      sceneTitleCard(2, root);
      VO.play('s3.intro'); VO.play('s3.rule', 'queue'); VO.play('s3.start', 'queue');
    },
    update: function () {
      if (selected && !State.settings.reducedMotion) selected.rotation.y = Math.sin(clock.elapsedTime * 1.2) * 0.45;
      Object.keys(bottles).forEach(function (id) { const g = bottles[id].g; if (g !== selected && g.rotation.y) g.rotation.y *= 0.9; });
    },
    relocalize: function () { Board.draw(); },
    getResult: function () { const c = counts(); return { correct: c.correct, placed: c.placed, attempts: attempt }; }
  };
}

/* ═══ 17d SCENE 4 — Final assessment, dashboard, certificate ═════════ */
function buildScene4(root) {
  const cfg = CONFIG.scene4;
  const Q = cfg.questions;

  Progress.setRequirements([

  }
  function block(ctx, W, y, label, opt, ok) {

  function paintFeedback(ctx, W, H, p) {

    ctx.fillStyle = a.correct ? C.ok : C.bad; font(ctx, 700, 40); para(ctx, t(a.correct ? UI_TEXT.verdictOk : UI_TEXT.verdictBad), 100, 164, W - 200, 54, 'center');

      const slot = isRTL() ? answers.length - 1 - i : i;
      const x = 70 + slot * cw + cw * 0.3, bh = 90 * a.confidence / 5;
      rr(ctx, x, y + 90 - bh, cw * 0.4, bh, 6); ctx.fillStyle = a.correct ? C.ok : C.bad; ctx.fill();
      ctx.fillStyle = C.ink3; font(ctx, 500, 20, true); ctx.direction = 'ltr'; ctx.textAlign = 'center'; ctx.fillText('Q' + (i + 1), x + cw * 0.2, y + 108);
    });
    ctx.fillStyle = C.ink3; font(ctx, 500, 20);
    para(ctx, t(UI_TEXT.confidenceShort) + ' 1–5  ·  ■ ' + t(UI_TEXT.correctLegend) + '  ·  ■ ' + t(UI_TEXT.wrongLegend), 70, y + 124, W - 140, 28, 'center');
    // actions
    const by = H - 104, bW = (W - 140 - 2 * 18) / 3;
    const acts = r.passed
      ? [{ id: 'review', label: UI_TEXT.reviewQuestions, style: 'ghost' }, { id: 'cert', label: cfg.certificateButton, style: 'gold', key: ['enter'], wide: true }]
      : [{ id: 'review', label: UI_TEXT.reviewQuestions, style: 'ghost' }, { id: 'retake', label: UI_TEXT.retake, style: 'primary', key: ['enter'] }, { id: 'cert-locked', label: cfg.certificateButton, style: 'disabled', disabled: true, lockIcon: true, sub: UI_TEXT.certNeeds }];
    let slotX = 0;
    acts.forEach(function (a, i) {
      const w = a.wide ? bW * 2 + 18 : bW;
      const x = isRTL() ? W - 70 - slotX - w : 70 + slotX;
      p.button({ id: a.id, x: x, y: by, w: w, h: 84, label: a.label, style: a.style, disabled: a.disabled, lockIcon: a.lockIcon, sub: a.sub, size: 26, key: a.key });
      slotX += w + 18;
    });
  }
  function paintReview(ctx, W, H, p) {
    const a = answers[reviewIdx], q = Q.find(function (x) { return x.id === a.qid; });
    const opt = q.options.find(function (o) { return o.id === a.chosen; }), right = q.options.find(function (o) { return o.correct; });
    ctx.fillStyle = a.correct ? C.ok : C.bad; font(ctx, 700, 36);
    para(ctx, (a.correct ? '✓ ' : '✗ ') + t(cfg.questionLabel) + ' ' + (reviewIdx + 1) + ' / ' + answers.length + '  ·  ' + a.loCode, 70, 44, W - 140, 48, 'start');
    ctx.fillStyle = C.ink; font(ctx, 600, 30);
    let y = para(ctx, t(q.text), 70, 110, W - 140, 42, 'start') + 20;
    if (!a.correct && opt) y = block(ctx, W, y, cfg.rationaleYourPickLabel, opt, false);
    block(ctx, W, y, cfg.rationaleCorrectLabel, right, true);
    const by = H - 104;
    if (reviewIdx > 0) p.button({ id: 'prev', x: isRTL() ? W - 70 - 240 : 70, y: by, w: 240, h: 84, label: UI_TEXT.prev, style: 'ghost', size: 28, key: ['1'] });
    if (reviewIdx + 1 < answers.length) p.button({ id: 'rnext', x: isRTL() ? 70 : W - 70 - 240, y: by, w: 240, h: 84, label: UI_TEXT.next, style: 'ghost', size: 28, key: ['2'] });
    p.button({ id: 'back', x: W / 2 - 190, y: by, w: 380, h: 84, label: UI_TEXT.backToResults, style: 'primary', size: 28, key: ['enter'] });
  }
  function retake() {
    attempt++; answers = []; result = null;
    XAPI.log('interacted', 'scene4.retake', { attempt: attempt });
    Progress.setReq(0, false, '0 / ' + Q.length); Progress.setReq(1, false, '0 / ' + cfg.completionThreshold.minCorrect);
    renderQuestion(0);
  }

  /* ---- certificate --------------------------------------------------- */
  const cert = CONFIG.certificate;
  function certId() {
    if (State.certificateId) return State.certificateId;
    const name = State.learner;
    let hash = 0;
    const seed = name + CONFIG.experience.id + Date.now().toString(36).slice(0, 6);
    for (let i = 0; i < seed.length; i++) hash = ((hash << 5) - hash + seed.charCodeAt(i)) | 0;
    State.certificateId = 'AMD-' + Math.abs(hash).toString(36).toUpperCase().slice(0, 4).padStart(4, '0') + '-' + Date.now().toString(36).toUpperCase().slice(-4);
    State.certificateDate = new Date();
    return State.certificateId;
  }
  function fmtDate(d) {
    try { return d.toLocaleDateString(LANG === 'ar' ? 'ar-SA-u-nu-latn-ca-gregory' : 'en-GB', { year: 'numeric', month: 'long', day: 'numeric' }); }
    catch (e) { return d.toISOString().slice(0, 10); }
  }
  /* Certificate — the original v1 design, restored as requested.
     Drawn in a 1216×1140 design space; scaled for the 3D panel and PNG export. */
  function paintCert(ctx, W, H) {
    const k = W / 1216;
    ctx.save(); ctx.scale(k, k);
    const w = 1216, h = 1140;
    const name = t(UI_TEXT.defaultLearner);
    const score = result ? result.correct : 0, total = result ? result.total : Q.length;
    const id = certId();
    const dateStr = (State.certificateDate || new Date()).toISOString().slice(0, 10);
    // panel body (same as the v1 UIPanel)
    rr(ctx, 4, 4, w - 8, h - 8, 28); ctx.fillStyle = 'rgba(15,23,42,0.97)'; ctx.fill();
    const bg = ctx.createLinearGradient(0, 0, w, 0);
    bg.addColorStop(0, 'rgba(124,58,237,0.7)'); bg.addColorStop(0.5, 'rgba(34,211,238,0.7)'); bg.addColorStop(1, 'rgba(245,158,11,0.7)');
    ctx.strokeStyle = bg; ctx.lineWidth = 3; rr(ctx, 4, 4, w - 8, h - 8, 28); ctx.stroke();
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; dirOf(ctx);
    function divider(cy, dw) {
      const g = ctx.createLinearGradient(w / 2 - dw / 2, 0, w / 2 + dw / 2, 0);
      g.addColorStop(0, 'rgba(124,58,237,0)'); g.addColorStop(0.5, 'rgba(245,158,11,0.65)'); g.addColorStop(1, 'rgba(34,211,238,0)');
      ctx.strokeStyle = g; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(w / 2 - dw / 2, cy); ctx.lineTo(w / 2 + dw / 2, cy); ctx.stroke();
    }
    function corner(x, y) { ctx.save(); ctx.translate(x, y); ctx.rotate(Math.PI / 4); ctx.fillStyle = 'rgba(245,158,11,0.55)'; ctx.fillRect(-6, -6, 12, 12); ctx.restore(); }
    const glow = ctx.createRadialGradient(w / 2, 150, 10, w / 2, 150, 260);
    glow.addColorStop(0, 'rgba(124,58,237,0.18)'); glow.addColorStop(1, 'rgba(124,58,237,0)');
    ctx.fillStyle = glow; ctx.fillRect(0, 0, w, h);
    const frameG = ctx.createLinearGradient(0, 0, w, 0);
    frameG.addColorStop(0, '#7C3AED'); frameG.addColorStop(0.5, '#22D3EE'); frameG.addColorStop(1, '#F59E0B');
    ctx.strokeStyle = frameG; ctx.lineWidth = 5; rr(ctx, 50, 50, w - 100, 1040, 22); ctx.stroke();
    ctx.strokeStyle = 'rgba(245,158,11,0.3)'; ctx.lineWidth = 2; rr(ctx, 66, 66, w - 132, 1008, 16); ctx.stroke();
    corner(90, 90); corner(w - 90, 90); corner(90, 1050); corner(w - 90, 1050);
    if (AmadLogo.complete && AmadLogo.naturalWidth) {
      const lw = 520, lh = lw * AmadLogo.naturalHeight / AmadLogo.naturalWidth;
      ctx.drawImage(AmadLogo, w / 2 - lw / 2, 110, lw, lh);
    } else {
      const g = ctx.createLinearGradient(w / 2 - 180, 0, w / 2 + 180, 0);
      g.addColorStop(0, '#7C3AED'); g.addColorStop(0.5, '#22D3EE'); g.addColorStop(1, '#F59E0B');
      ctx.fillStyle = g; font(ctx, 800, 50); ctx.fillText(S(t(CONFIG.ui.appTitle)), w / 2, 250);
    }
    ctx.fillStyle = '#94a3b8'; font(ctx, 500, 24);
    ctx.fillText('AmadXR · ' + (LANG === 'ar' ? 'منظومة محاكاة احترافية' : 'Professional Simulation System'), w / 2, 350);
    divider(388, 260);
    ctx.fillStyle = '#94a3b8'; font(ctx, 500, 28);
    ctx.fillText(LANG === 'ar' ? 'شهادة إتمام التجربة' : 'Certificate of completion', w / 2, 436);
    ctx.fillStyle = '#f8fafc'; font(ctx, 800, 62); ctx.fillText(S(name), w / 2, 520);
    divider(570, 220);
    ctx.fillStyle = '#cbd5e1'; font(ctx, 500, 30); ctx.fillText(S(t(cert.forCompleting)), w / 2, 620);
    ctx.fillStyle = '#FBBF24'; font(ctx, 700, 40); ctx.fillText(S(t(CONFIG.experience.title)), w / 2, 686);
    ctx.fillStyle = '#67e8f9'; font(ctx, 600, 32);
    ctx.fillText((LANG === 'ar' ? 'النتيجة: ' : 'Score: ') + score + ' / ' + total, w / 2, 758);
    ctx.direction = 'ltr'; ctx.fillStyle = '#64748b'; ctx.font = '500 24px monospace';
    ctx.fillText('ID: ' + id + '  ·  ' + dateStr, w / 2, 816);
    dirOf(ctx);
    divider(858, 200);
    ctx.fillStyle = '#94a3b8'; font(ctx, 500, 24);
    ctx.fillText(LANG === 'ar' ? 'منظومة محاكاة احترافية متكاملة' : 'An integrated professional simulation system', w / 2, 906);
    ctx.fillStyle = '#64748b'; ctx.font = 'italic 500 24px ' + FONT;
    ctx.fillText(LANG === 'ar' ? 'حيث تُلمس الأفكار' : 'Where ideas become tangible', w / 2, 953);
    ctx.restore();
  }
  let certPanel = null, actPanel = null, finaleShown = false;
  function showCertificate() {
    if (!result || !result.passed) return;
    certId();
    qp.hide();
    if (!certPanel) {
      certPanel = new Panel({ w: 1.25, pxW: 1216, pxH: 1140, bg: 'none' });
      certPanel.paint = function (ctx, W, H) { paintCert(ctx, W, H); };
      certPanel.mesh.position.set(0, 1.66, -1.55); root.add(certPanel.mesh);
      actPanel = new Panel({ w: 1.2, pxW: 1300, pxH: 260, interactive: true });
      actPanel.paint = function (ctx, W, H, p) {
        ctx.fillStyle = C.ink; font(ctx, 700, 32); para(ctx, t(UI_TEXT.finaleTitle), 40, 24, W - 80, 42, 'center');
        ctx.fillStyle = C.ink3; font(ctx, 500, 24); para(ctx, t(UI_TEXT.finaleBody), 40, 68, W - 80, 32, 'center');
        const bw = (W - 80 - 2 * 18) / 3;
        [['save', cert.download, 'gold'], ['results', UI_TEXT.backToResults, 'ghost'], ['restart', cert.restart, 'primary']].forEach(function (b, i) {
          const slot = isRTL() ? 2 - i : i;
          p.button({ id: b[0], x: 40 + slot * (bw + 18), y: 128, w: bw, h: 96, label: b[1], style: b[2], size: 28, key: [String(i + 1)] });
        });
      };
      actPanel.onPress = function (id) {
        if (id === 'save') saveCertificate();
        else if (id === 'results') { certPanel.hide(); actPanel.hide(); view = 'results'; qp.show(); SM.focus = qp; IM.setModal([qp.mesh]); }
        else if (id === 'restart') SM.restart();
      };
      actPanel.mesh.position.set(0, 0.86, -1.35); actPanel.mesh.rotation.x = -0.35; root.add(actPanel.mesh);
    }
    certPanel.show(); actPanel.show();
    SM.focus = certPanel;
    IM.setModal([actPanel.mesh]);
    AudioFX.chime();
    VO.play('s4.certificate');
    XAPI.log('experienced', 'scene4.certificate', { certificateId: State.certificateId, score: result.correct, outOf: result.total });
    if (!finaleShown) { finaleShown = true; XAPI.log('completed', 'scene-4', { score: result.correct, outOf: result.total }); XAPI.log('completed', 'experience', null); }
    Progress.setObjective(null);
  }
  function saveCertificate() {
    try {
      const c = document.createElement('canvas'); c.width = 2432; c.height = 2280;
      paintCert(c.getContext('2d'), 2432, 2280, 0);
      c.toBlob(function (blob) {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'Al-Amad-Certificate-' + State.certificateId + '.png';
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
        Notice.show('ok', UI_TEXT.saved, 3000);
        XAPI.log('interacted', 'scene4.certificate.saved', { certificateId: State.certificateId });
      });
    } catch (e) { console.warn(e); }
  }

  return {
    onEnter: function () {
      sceneTitleCard(3, root);
      VO.play('s4.intro'); VO.play('s4.confidence', 'queue');
      renderQuestion(0);
      qp.show(); SM.focus = qp; IM.setModal([qp.mesh]);
    },
    update: function () {
      // Short, rare encouragement — only when the learner is stuck and the teacher is silent.
      if (view !== 'question' || !qStart || SM.busy || VO.isSpeaking() || VO.queue.length) return;
      const now = performance.now();
      if ((!chosen && now - qStart > 40000) || (chosen && chosenAt && now - chosenAt > 22000)) VO.play('s4.encouragement', 'idle');
    },
    relocalize: function () { Board.draw(); },
    getResult: function () { return { answers: answers.length, passed: result ? result.passed : false }; }
  };
}

/* ═══ 18 BOOT ══════════════════════════════════════════════════════════ */
const AmadLogo = new Image();
AmadLogo.src = AMAD_LOGO_SRC;
AmadLogo.onload = function () { panels.forEach(function (p) { if (p.mesh.parent) p.redraw(); }); };

const Boot = {
  vrSupported: false, started: false,
  loop: function () {
    renderer.setAnimationLoop(function () {
      const dt = Math.min(0.05, clock.getDelta());
      updateLocomotion(dt);
      pollButtons();
      updateTweens(dt);
      updateTimers();
      updateFade(dt);
      updateHover();
      SM.update(dt);
      VO.update(dt);
      for (let i = 0; i < Loop.fns.length; i++) Loop.fns[i](dt);
      Captions.update(dt);
      Notice.update();
      Hints.update();
      renderer.render(scene, camera);
    });
  },
  requestVR: function () {
    if (!navigator.xr) return;
    navigator.xr.requestSession('immersive-vr', { optionalFeatures: ['local-floor', 'bounded-floor', 'hand-tracking'] })
      .then(function (s) { VO.watchSession(s); renderer.xr.setSession(s); })
      .catch(function (e) { console.warn('XR session failed, continuing on screen:', e); Notice.show('info', UI_TEXT.vrUnavailable, 5000); });
  },
  enterVR: function () { if (this.started) this.requestVR(); },
  begin: function (asVR) {
    if (this.started) return;
    this.started = true;
    State.learner = t(UI_TEXT.defaultLearner);
    window.__LEARNER_NAME__ = State.learner;
    XAPI.setActor(State.learner);
    AudioFX.unlock();
    VO.init();
    AudioManager.setEnabled(State.settings.audio);
    runGlyphProbe();
    $('loading').hidden = false;
    $('loading-text').textContent = t(CONFIG.ui.loading);
    initEngine();
    buildLab();
    initControllers();
    Board.init();
    Captions.init();
    HUD.init();
    SM.init([buildScene1, buildScene2, buildScene3, buildScene4]);
    this.loop();
    if (asVR) this.requestVR();            // must stay inside the click gesture
    $('lobby').hidden = true;
    HUD.show();
    XAPI.log('experienced', 'experience.start', { mode: asVR ? 'immersive-vr' : 'desktop', learner: State.learner });
    SM.run(buildOnboarding, -1);
    SM.started = true;
    setTimeout(function () { $('loading').classList.add('out'); setTimeout(function () { $('loading').hidden = true; }, 450); }, 350);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { runGlyphProbe(); panels.forEach(function (p) { if (p.mesh.parent) p.redraw(); }); });
  }
};

/* ---- lobby -------------------------------------------------------------- */
const Lobby = {
  init: function () {
    const self = this;
    $('lb-logo').src = AMAD_LOGO_SRC;
    $('lang-ar').addEventListener('click', function () { I18N.set('ar'); });
    $('lang-en').addEventListener('click', function () { I18N.set('en'); });
    $('btn-desktop').addEventListener('click', function () { Boot.begin(false); });
    $('btn-vr').addEventListener('click', function () { Boot.begin(true); });
    I18N.on(function () { self.render(); });
    $('btn-vr').disabled = true; $('btn-vr').classList.remove('primary'); $('btn-desktop').classList.add('primary');
    if (navigator.xr && navigator.xr.isSessionSupported) {
      navigator.xr.isSessionSupported('immersive-vr').then(function (ok) { Boot.vrSupported = ok; $('btn-vr').disabled = !ok; $('btn-vr').classList.toggle('primary', ok); $('btn-desktop').classList.toggle('primary', !ok); self.render(); })
        .catch(function () { self.render(); });
    }
    this.render();
    this.ions();
  },
  render: function () {
    const ex = CONFIG.experience, intro = CONFIG.introScreen;
    $('lang-ar').setAttribute('aria-pressed', String(LANG === 'ar'));
    $('lang-en').setAttribute('aria-pressed', String(LANG === 'en'));
    $('lb-welcome').textContent = t(intro.welcome);
    $('lb-title').textContent = t(ex.title);
    $('lb-lede').textContent = t(UI_TEXT.lede);
    const clock = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>';
    const layers = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3.5l8.5 4.5-8.5 4.5L3.5 8z"/><path d="M3.5 12.5L12 17l8.5-4.5"/></svg>';
    const cap = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M2.5 9L12 4.5 21.5 9 12 13.5z"/><path d="M6.5 11v4.5c1.5 1.3 3.4 2 5.5 2s4-.7 5.5-2V11"/></svg>';
    $('lb-meta').innerHTML =
      '<li>' + clock + '<span>' + ex.estimatedDurationMin + ' ' + escapeHtml(t(UI_TEXT.minutes)) + '</span></li>' +
      '<li>' + layers + '<span>' + ex.totalScenes + ' ' + escapeHtml(t(UI_TEXT.scenesWord)) + '</span></li>' +
      '<li>' + cap + '<span>' + escapeHtml(t(ex.audience)) + '</span></li>';
    $('lb-vr-t').textContent = LANG === 'ar' ? 'ادخل بالواقع الافتراضي' : 'Enter in VR';
    $('lb-vr-s').textContent = t(UI_TEXT.vrBtnSub);
    $('lb-dk-t').textContent = LANG === 'ar' ? 'ابدأ على الشاشة' : 'Start on screen';
    $('lb-dk-s').textContent = t(UI_TEXT.dkBtnSub);
    $('vr-status').textContent = t(Boot.vrSupported ? UI_TEXT.vrReady : UI_TEXT.vrUnavailable);
    $('lb-journey-title').textContent = t(UI_TEXT.journeyTitle);
    $('lb-journey-intro').textContent = t(UI_TEXT.journeyIntro);
    $('lb-journey').innerHTML = [1, 2, 3, 4].map(function (n) {
      return '<li><span class="num">' + n + '</span><div><h3>' + escapeHtml(t(CONFIG['scene' + n].title)) + '</h3><p>' + escapeHtml(t(UI_TEXT.journey[n - 1])) + '</p></div></li>';
    }).join('');
    $('lb-lo-sum').textContent = t(intro.objectivesTitle) + ' (' + CONFIG.learningObjectives.length + ')';
    $('lb-lo-list').innerHTML = CONFIG.learningObjectives.map(function (lo) { return '<li><span class="lo-code">' + lo.code + '</span><span>' + escapeHtml(t(lo)) + '</span></li>'; }).join('');
    $('lb-mg-sum').textContent = t(UI_TEXT.masteryTitle);
    $('lb-mg-body').textContent = t(intro.masteryNotice);
    $('lb-ct-sum').textContent = t(UI_TEXT.controlsTitle);
    $('lb-ct-body').textContent = t(UI_TEXT.controlsBody);
    $('lb-foot').textContent = t(UI_TEXT.footer) + ' · ' + t(ex.course);
    document.title = t(ex.title) + ' — VR · ' + t(CONFIG.ui.appTitle);
  },
  /* Background motif: slowly drifting H⁺ / anion pairs (static if reduced motion). */
  ions: function () {
    const cv = $('lobby-ions'), ctx = cv.getContext('2d');
    const pts = [];
    function size() { cv.width = cv.clientWidth * Math.min(2, devicePixelRatio || 1); cv.height = cv.clientHeight * Math.min(2, devicePixelRatio || 1); }
    size(); window.addEventListener('resize', size);
    for (let i = 0; i < 34; i++) pts.push({ x: Math.random(), y: Math.random(), vx: (Math.random() - 0.5) * 0.00012, vy: (Math.random() - 0.5) * 0.00012, a: Math.random() * 6.28, paired: Math.random() < 0.5 });
    function frame() {
      if (Boot.started) return;
      const w = cv.width, h = cv.height, s = Math.min(2, devicePixelRatio || 1);
      ctx.clearRect(0, 0, w, h);
      pts.forEach(function (p) {
        if (!State.settings.reducedMotion) { p.x = (p.x + p.vx + 1) % 1; p.y = (p.y + p.vy + 1) % 1; p.a += 0.002; }
        const x = p.x * w, y = p.y * h, d = (p.paired ? 9 : 26) * s;
        ctx.fillStyle = 'rgba(34,211,238,0.55)'; ctx.beginPath(); ctx.arc(x + Math.cos(p.a) * d, y + Math.sin(p.a) * d, 3 * s, 0, 6.28); ctx.fill();
        ctx.fillStyle = 'rgba(157,107,242,0.5)'; ctx.beginPath(); ctx.arc(x - Math.cos(p.a) * d, y - Math.sin(p.a) * d, 5 * s, 0, 6.28); ctx.fill();
      });
      requestAnimationFrame(frame);
    }
    frame();
  }
};
if (document.fonts && document.fonts.load) {
  Promise.all([document.fonts.load('600 32px "IBM Plex Sans Arabic"'), document.fonts.load('600 32px "IBM Plex Sans"')]).catch(function () {});
}
I18N.set(LANG);
Lobby.init();
